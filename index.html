<!DOCTYPE html>
<html lang="en">
<head>

<title>Anar's Life HQ — 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body { font-family:'Courier New', Courier, monospace; color:#d8d4e8; background:#0b0b18; transition:background 3s; }
  body.phase-night { background:linear-gradient(180deg,#04040d 0%,#0b0b20 50%,#141432 100%); }
  body.phase-dawn  { background:linear-gradient(180deg,#12122e 0%,#31264e 45%,#6e3f5c 75%,#c9764f 100%); }
  body.phase-day   { background:linear-gradient(180deg,#3a6ab0 0%,#5d8cc4 55%,#8fb4dc 100%); }
  body.phase-dusk  { background:linear-gradient(180deg,#16163a 0%,#41264e 48%,#7e3f54 76%,#d9824f 100%); }
  #c { position:fixed; inset:0; display:block; }
  #labels { position:fixed; inset:0; pointer-events:none; }

  .nametag { background:rgba(10,10,22,.8); border:2px solid #06060e; padding:1px 6px; font-size:10px;
    font-weight:bold; letter-spacing:1px; white-space:nowrap; }
  .cbubble { background:#f4efdd; color:#1a1a2e; border:2px solid #1a1a2e; box-shadow:3px 3px 0 rgba(0,0,0,.4);
    padding:4px 8px; font-size:11px; font-weight:bold; max-width:230px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; opacity:0; transition:opacity .4s; }
  .roomlabel { color:#ffd75e; font-size:10px; letter-spacing:2px; font-weight:bold; text-shadow:0 1px 3px #000a;
    background:rgba(10,10,22,.55); padding:1px 6px; border:1px solid #0006; }

  #topbar { position:fixed; top:0; left:0; right:0; display:flex; gap:8px; align-items:center;
    padding:8px 12px; z-index:10; flex-wrap:wrap; }
  #topbar .brand { display:flex; align-items:center; gap:8px; margin-right:6px; }
  #topbar .gem { width:13px; height:13px; background:#7ee08a; transform:rotate(45deg); box-shadow:0 0 8px #7ee08a88; }
  #topbar b { color:#fff; letter-spacing:2px; font-size:13px; text-shadow:0 1px 3px #000; }
  .chip { font-size:10px; letter-spacing:1px; padding:4px 8px; border:2px solid #2a2a44; background:rgba(11,11,24,.8); color:#b8b4d0; }
  .chip.btn { cursor:pointer; }
  .chip.btn:hover { border-color:#7ec8e8; color:#fff; }

  #hud { position:fixed; top:44px; right:12px; z-index:10; background:rgba(12,12,26,.85);
    border:3px solid #06060e; box-shadow:0 0 0 2px #3a3a5a, 5px 5px 0 rgba(0,0,0,.45);
    padding:10px 12px; font-size:10px; min-width:176px; }

  #hud .hd .mood { margin-left:auto; font-size:9px; }
  #hud .nrow { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  #hud .nrow .lb { width:34px; color:#9a96b8; font-size:9px; letter-spacing:1px; }
  #hud .segs { display:flex; gap:2px; }
  #hud .segs i { width:9px; height:8px; background:#1a1a2e; border:1px solid #06060e; }
  #hud .wk { margin-top:7px; color:#6a6a90; font-size:9px; letter-spacing:1px; }

  #term { position:fixed; left:12px; right:12px; bottom:10px; z-index:10; border:3px solid #06060e;
    background:rgba(10,10,20,.88); box-shadow:5px 5px 0 rgba(0,0,0,.4); max-width:760px; margin:0 auto; }
  #termhead { display:flex; align-items:center; background:#141426; border-bottom:2px solid #06060e;
    font-size:9px; letter-spacing:2px; cursor:pointer; }
  #termhead .tab { padding:5px 12px; color:#7ee08a; }
  #termhead .right { margin-left:auto; padding:5px 10px; color:#4a4a68; }
  #termbody { height:110px; overflow-y:auto; padding:6px 10px; font-size:11px; line-height:1.5;
    background-image:repeating-linear-gradient(0deg, rgba(126,224,138,.035) 0 1px, transparent 1px 3px); }
  #termbody .ln .t { color:#4a4a68; }
  #termbody .ln.dim { opacity:.45; }
  .w-job-scout{color:#e0c060} .w-chief-of-staff{color:#7ec8e8} .w-application-writer{color:#7ee08a}
  .w-ypg-producer{color:#ff8a8a} .w-life-checkin{color:#c9a0ff} .w-system{color:#9a9ac0} .w-anar{color:#f0f0f0}
  body.term-min #termbody { display:none; }

  #ticker { position:fixed; left:14px; bottom:20px; display:none; align-items:center; gap:8px;
    background:rgba(10,10,22,.85); border:2px solid #06060e; box-shadow:3px 3px 0 rgba(0,0,0,.4);
    padding:6px 11px; font-size:11px; color:#c8c4e0; z-index:10; max-width:60vw; }
  #ticker .pulse { width:7px; height:7px; background:#7ee08a; animation:blink 2s steps(1) infinite; }
  #ticker b { color:#ffd75e; }
  @keyframes blink { 0%,60%{opacity:1} 61%,100%{opacity:.15} }

  body.wallpaper #topbar, body.wallpaper #term, body.wallpaper #panelwrap { display:none; }
  body.wallpaper #ticker { display:flex; }

  #panelwrap { position:fixed; inset:0; background:rgba(6,6,16,.7); display:none; z-index:20;
    align-items:center; justify-content:center; padding:16px; }
  #panelwrap.open { display:flex; }
  #panel { width:min(520px,94vw); max-height:82vh; overflow-y:auto; background:#20203c; border:4px solid #06060e;
    box-shadow:0 0 0 4px #3a3a5a, 12px 12px 0 rgba(0,0,0,.55); padding:18px; position:relative; }
  #panel h2 { color:#ffd75e; font-size:15px; letter-spacing:3px; margin-bottom:2px; }
  #panel .sub { color:#9a9ac0; font-size:10px; letter-spacing:2px; margin-bottom:12px; }
  #panel .row { margin-bottom:10px; font-size:12px; line-height:1.5; }
  #panel .lab { color:#7ec8e8; font-size:9px; letter-spacing:2px; display:block; margin-bottom:2px; }
  #panel .bigtrack { height:16px; background:#06060e; border:2px solid #2a2a44; position:relative; margin-top:4px; }
  #panel .bigtrack i { position:absolute; left:0; top:0; bottom:0;
    background-image:repeating-linear-gradient(90deg, transparent 0 10px, rgba(6,6,14,.75) 10px 12px); }
  #pclose { position:absolute; top:10px; right:10px; background:#7a3030; color:#fff; border:3px solid #06060e;
    font-family:inherit; font-weight:bold; font-size:12px; padding:3px 8px; cursor:pointer; }

  #loader { position:fixed; inset:0; background:#0b0b18; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; transition:opacity .8s; }
  #loader .gem { width:26px; height:26px; background:#7ee08a; transform:rotate(45deg); animation:blink 1s steps(1) infinite; }
  #loader div { letter-spacing:3px; font-size:12px; color:#9a9ac0; }
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './GLTFLoader.js';
import { OrbitControls } from './OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from './CSS2DRenderer.js';
import * as SkeletonUtils from './SkeletonUtils.js';

/* ================= data ================= */
const DEFAULT_DATA = {
  "agent-status": {
    "job-scout":          { status:"idle",  activity:"First patrol tomorrow, 7:30" },
    "chief-of-staff":     { status:"idle",  activity:"First brief Tue, 7:35" },
    "application-writer": { status:"ready", activity:"Bring me a posting!" },
    "ypg-producer":       { status:"idle",  activity:"Next session Mon 9:00" },
    "anar":               { status:"ready", activity:"My agents work while I live" }
  },
  "life-status": {
    week:"Week of Aug 10, 2026", mood:60,
    needs:{ finances:60, health:60, career:60, study:60, social:60, civic:60 },
    events:[ "Life HQ 3D — the dollhouse update" ]
  }
};
let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
function poll(){
  fetch('./status.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{ if(j&&j['agent-status']) DATA['agent-status']=j['agent-status'];
               if(j&&j['life-status'])  DATA['life-status'] =j['life-status'];
               refreshHUD(); refreshChips(); })
    .catch(()=>{});
}
poll(); setInterval(poll, 60000);

const WALLPAPER = /wallpaper/.test(location.search + location.hash);
if (WALLPAPER) document.body.classList.add('wallpaper');

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
function needColor(v){ return v>=66 ? '#7ee08a' : (v>=40 ? '#ffd75e' : '#ff6b6b'); }
function moodWord(v){ return v>=75?'ECSTATIC':(v>=60?'COMFY':(v>=45?'RESTLESS':(v>=30?'UNEASY':'DESPERATE'))); }
function moodColor(v){ return v>=75?'#7ee08a':(v>=60?'#a8d878':(v>=45?'#ffd75e':(v>=30?'#ff9a5e':'#ff6b6b'))); }
function avgNeeds(){ const n=DATA['life-status'].needs||{}; const vs=Object.values(n).filter(x=>typeof x==='number');
  return vs.length? Math.round(vs.reduce((a,b)=>a+b,0)/vs.length) : 60; }
function hourFrac(){ const m=(location.hash.match(/t=([0-9.]+)/)); if(m) return parseFloat(m[1]);
  const d=new Date(); return d.getHours()+d.getMinutes()/60; }
function phaseOf(h){ return (h<5.5||h>=21.5)?'night':(h<8.5?'dawn':(h<17.5?'day':'dusk')); }

/* ================= rooms & cast config ================= */
const ROOMS = [
  { key:'health',   title:'HEALTH',   need:'health',   x:-8, z:-4.2, floor:0xc9a06a, wall:0xa8cfe0, res:[] },
  { key:'study',    title:'STUDY',    need:'study',    x: 0, z:-4.2, floor:0xba9260, wall:0xf0d9a8, res:[] },
  { key:'social',   title:'SOCIAL',   need:'social',   x: 8, z:-4.2, floor:0xc9a06a, wall:0xcdb3d6, res:[] },
  { key:'finances', title:'FINANCES', need:'finances', x:-8, z: 4.2, floor:0xba9260, wall:0xaecdae, res:['chief-of-staff'] },
  { key:'career',   title:'CAREER',   need:'career',   x: 0, z: 4.2, floor:0xc9a06a, wall:0xe8cba0, res:['job-scout','application-writer'] },
  { key:'civic',    title:'YPG HALL', need:'civic',    x: 8, z: 4.2, floor:0xba9260, wall:0xe8b0b0, res:['ypg-producer'] }
];
const ROOM_HOW = {
  finances:'Reply to the Sunday check-in with savings / spend, or tell Claude: "finances 70, saved ₮300k".',
  health:'Tell Claude: "health 75 — gym 3x this week" or reply to the Sunday check-in.',
  career:'Scout reports daily 7:30. Paste any posting in a chat to summon Ink.',
  study:'Fulbright / Australia Awards — tell Claude "study 80, personal statement drafted".',
  social:'Your Sim needs people time. Update it at the Sunday check-in.',
  civic:'Tuya plans the week every Monday 9:00.'
};
const CAST = [
  { key:'anar', name:'ANAR',  body:'web_male.glb',   hair:'web_Hair_SimpleParted.glb', color:0x6aa2e8, home:null },
  { key:'job-scout', name:'SCOUT', body:'web_male.glb', hair:'web_Hair_Beard.glb',     color:0xd9b36a, home:'career' },
  { key:'chief-of-staff', name:'ODKO', body:'web_female.glb', hair:'web_Hair_Buns.glb', color:0x5abfae, home:'finances' },
  { key:'application-writer', name:'INK', body:'web_male.glb', hair:'web_Hair_Buzzed.glb', color:0x7ec98a, home:'career' },
  { key:'ypg-producer', name:'TUYA', body:'web_female.glb', hair:'web_Hair_Long.glb',  color:0xe8798a, home:'civic' }
];
const AGENT_META = {
  'anar':{ mission:"The Sim himself. Watches the plumbob, lives the life the agents support.", sched:"Full-time." },
  'job-scout':{ mission:"Patrols careers pages & job boards, brings back ranked roles.", sched:"Daily 7:30 — push+email." },
  'chief-of-staff':{ mission:"Morning brief: inbox triage, calendar, top 3 priorities.", sched:"Weekdays 7:35 — push+email." },
  'application-writer':{ mission:"Cover letters, bios, essays in Anar's voice.", sched:"On call — paste a posting." },
  'ypg-producer':{ mission:"Sets up YPG's week: threads, events, share-worthy news.", sched:"Mondays 9:00 — push+email." }
};

/* furniture: [file, dx, dz, rotYdeg, scale, dy] in room-local coords (-3..3) */
const FURNITURE = {
  health: [ ['f_benchCushionLow',-1.4,-1.6,90], ['f_rugRectangle',0.8,0.6,0], ['f_radio',-2.6,-2.5,0,1,0],
            ['f_plantSmall2',2.6,-2.6,0], ['f_trashcan',2.7,2.4,0], ['f_pottedPlant',-2.7,1.9,0],
            ['f_lampRoundFloor',2.6,0.4,0], ['f_rugRound',-1.0,1.6,0] ],
  study:  [ ['f_bookcaseClosedWide',-1.2,-2.72,0], ['f_bookcaseOpen',1.4,-2.72,0], ['f_desk',0.4,0.8,180],
            ['f_chairDesk',0.4,1.7,0], ['f_books',0.15,0.8,20,1,0.76], ['f_lampRoundFloor',2.6,-1.8,0],
            ['f_rugRound',-1.6,1.4,0], ['f_pottedPlant',-2.7,2.2,0], ['f_tableCoffee',-1.6,1.4,0],
            ['f_books',-1.75,1.3,15,1,0.42] ],
  social: [ ['f_loungeSofa',-1.2,-2.4,0], ['f_loungeChairRelax',1.9,-1.7,-35], ['f_tableCoffee',-0.9,-0.7,0],
            ['f_cabinetTelevision',-0.6,2.55,180], ['f_televisionModern',-0.6,2.5,180,1,0.74],
            ['f_speaker',1.4,2.6,180], ['f_rugRound',0,0.4,0], ['f_pottedPlant',2.7,-2.7,0],
            ['f_plantSmall1',-2.7,2.3,0], ['f_lampRoundFloor',2.6,1.6,0], ['f_sideTable',2.0,-2.6,0],
            ['f_radio',2.0,-2.6,0,1,0.7] ],
  finances:[ ['f_desk',-0.6,-1.9,0], ['f_chairDesk',-0.6,-1.0,180], ['f_computerScreen',-0.85,-2.05,0,1,0.76],
            ['f_computerKeyboard',-0.55,-1.75,0,1,0.76], ['f_cabinetBedDrawer',2.5,-2.5,0],
            ['f_cardboardBoxClosed',2.5,-1.4,15], ['f_lampSquareTable',0.4,-2.1,0,1,0.76], ['f_pottedPlant',2.6,1.5,0], ['f_rugRound',-0.6,0.6,0], ['f_lampRoundFloor',-2.7,1.8,0], ['f_plantSmall1',-2.7,-2.6,0],
            ['f_sideTable',2.5,2.3,0] ],
  career: [ ['f_deskCorner',-2.0,-2.0,0], ['f_chairDesk',-1.3,-1.3,225], ['f_laptop',-2.05,-1.85,35,1,0.76],
            ['f_desk',1.7,-2.0,0], ['f_chairDesk',1.7,-1.1,180], ['f_computerScreen',1.5,-2.15,0,1,0.76],
            ['f_computerKeyboard',1.75,-1.85,0,1,0.76], ['f_coatRackStanding',2.75,0.9,0],
            ['f_bookcaseOpen',-2.72,1.4,90], ['f_rugRectangle',0,2.2,0], ['f_pottedPlant',2.75,-2.6,0],
            ['f_plantSmall2',-2.7,2.6,0], ['f_lampRoundFloor',2.6,2.4,0] ],
  civic:  [ ['f_tableCross',0,-0.4,0,0.75], ['f_chair',-0.9,0.7,180], ['f_chair',0.9,0.7,180], ['f_chair',-0.9,-1.4,0],
            ['f_chair',0.9,-1.4,0], ['f_sideTable',-2.6,-2.5,0], ['f_kitchenCoffeeMachine',-2.6,-2.5,0,1,0.68],
            ['f_speaker',2.7,-2.6,0], ['f_coatRackStanding',0,2.9,180], ['f_pottedPlant',-2.7,2.4,0],
            ['f_rugRound',0,-0.4,0], ['f_lampRoundFloor',2.6,1.8,0] ]
};
/* fix: rugDoormat not copied — swap to rugRectangle if missing handled at load */

/* ================= three setup ================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const lampLights = [];

const labelRenderer = new CSS2DRenderer({ element: $('labels') });
const aspect = () => window.innerWidth / window.innerHeight;
const VIEW = 12.5;
const camera = new THREE.OrthographicCamera(-VIEW*aspect(), VIEW*aspect(), VIEW, -VIEW, 0.1, 200);
camera.position.set(20, 18, 20);
camera.lookAt(0, 0, 0.6);

function onResize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  camera.left=-VIEW*aspect(); camera.right=VIEW*aspect(); camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize); onResize();

let controls = null;
if (!WALLPAPER){
  controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 0, 0.6);
  controls.enablePan = false;
  controls.minZoom = 0.7; controls.maxZoom = 2.2;
  controls.minPolarAngle = 0.5; controls.maxPolarAngle = 1.25;
  controls.update();
}

/* lights (phase-aware) */
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x8a6f52, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(14, 22, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left=-16; sun.shadow.camera.right=16; sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
scene.add(sun);
let curPhase = null;
function applyPhase(){
  const ph = phaseOf(hourFrac());
  if (ph === curPhase) return; curPhase = ph;
  document.body.classList.remove('phase-night','phase-dawn','phase-day','phase-dusk');
  document.body.classList.add('phase-'+ph);
  const cfg = {
    day:   { sun:0xfff2d8, si:1.8, hemi:0xcfe0ff, hi:1.05 },
    dawn:  { sun:0xffb27a, si:1.2, hemi:0x8a7aa8, hi:0.75 },
    dusk:  { sun:0xff9a6a, si:1.1, hemi:0x7a6a9a, hi:0.7 },
    night: { sun:0xaebfff, si:0.6, hemi:0x55628a, hi:0.6 }
  }[ph];
  sun.color.setHex(cfg.sun); sun.intensity = cfg.si;
  hemi.color.setHex(cfg.hemi); hemi.intensity = cfg.hi;
  const lampI = ph==='night' ? 1.5 : (ph==='day' ? 0.15 : 0.8);
  for (const pl of lampLights) pl.intensity = lampI;
  const days=['SUN','MON','TUE','WED','THU','FRI','SAT']; const d=new Date();
  $('chip-phase').textContent = (ph==='night'?'☾ ':'☀ ')+ph.toUpperCase()+' · '+days[d.getDay()]+' '+
    ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
applyPhase(); setInterval(applyPhase, 30000);

/* ================= build house ================= */
const matWall = new THREE.MeshStandardMaterial({ color:0xe8e2d4, roughness:0.9 });
const matWallDark = new THREE.MeshStandardMaterial({ color:0x8a8276, roughness:0.9 });
const plinth = new THREE.Mesh(new THREE.BoxGeometry(25.4, 0.6, 17.6), new THREE.MeshStandardMaterial({ color:0x9a7a54, roughness:0.95 }));
plinth.position.y = -0.31; plinth.receiveShadow = true; scene.add(plinth);
const lawn = new THREE.Mesh(new THREE.BoxGeometry(44, 0.3, 34), new THREE.MeshStandardMaterial({ color:0x86b86a, roughness:1 }));
lawn.position.y = -0.62; lawn.receiveShadow = true; scene.add(lawn);

const roomObjs = {};
const clickFloors = [];
for (const r of ROOMS){
  const g = new THREE.Group(); g.position.set(r.x, 0, r.z); scene.add(g);
  const floor = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.22, 7.6),
    new THREE.MeshStandardMaterial({ color:r.floor, roughness:0.95 }));
  floor.position.y = 0.11; floor.receiveShadow = true; floor.userData.roomKey = r.key;
  g.add(floor); clickFloors.push(floor);
  /* pastel walls with white trim */
  const wallMat = new THREE.MeshStandardMaterial({ color:r.wall||0xe8e2d4, roughness:0.9 });
  const trimMat = new THREE.MeshStandardMaterial({ color:0xf7f2e6, roughness:0.85 });
  function mkWall(w, d, x, z){
    const wl = new THREE.Mesh(new THREE.BoxGeometry(w, 1.25, d), wallMat);
    wl.position.set(x, 0.84, z); wl.castShadow = true; wl.receiveShadow = true; g.add(wl);
    const tr = new THREE.Mesh(new THREE.BoxGeometry(w===7.6?7.7:0.3, 0.09, d===7.6?7.7:0.3), trimMat);
    tr.position.set(x, 1.51, z); g.add(tr);
  }
  mkWall(7.6, 0.22, 0, -3.8);
  mkWall(0.22, 7.6, -3.8, 0);
  if (r.x === 8) mkWall(0.22, 7.6, 3.8, 0);
  /* label */
  const lbl = document.createElement('div'); lbl.className='roomlabel'; lbl.textContent = r.title;
  const lblObj = new CSS2DObject(lbl); lblObj.position.set(0, 1.9, -3.4); g.add(lblObj);
  roomObjs[r.key] = g;
}

/* ================= load assets ================= */
const loader = new GLTFLoader();
const cache = {};
function loadGLB(url){
  if (!cache[url]) cache[url] = new Promise((res, rej)=> loader.load(url, res, undefined, rej));
  return cache[url];
}
let loadedCount = 0, totalCount = 0;
function tick(msg){ loadedCount++; $('loadmsg').textContent = 'BUILDING LIFE HQ… '+loadedCount+'/'+totalCount; }

const furnitureFiles = [...new Set(Object.values(FURNITURE).flat().map(f=>f[0]))];
const castFiles = [...new Set(CAST.flatMap(c=>[c.body, c.hair]))];
totalCount = furnitureFiles.length + castFiles.length + 1;

/* furniture placement */
async function placeGarden(){
  try {
    const g = await loadGLB('./f_pottedPlant.glb');
    const spots = [[-14.5,-10],[14.5,-10],[-14.5,10],[14.5,10],[0,-10.6],[-7,10.6],[7,10.6]];
    for (const [gx,gz] of spots){
      const p = g.scene.clone(true);
      p.traverse(o=>{ if (o.isMesh){ o.castShadow = true; } });
      p.position.set(gx, -0.47, gz); p.scale.setScalar(4.2);
      scene.add(p);
    }
  } catch(e){}
}
async function placeFurniture(){
  for (const r of ROOMS){
    for (const item of (FURNITURE[r.key]||[])){
      let [file, dx, dz, rot=0, s=1, dy=0] = item;
      let gltf;
      try { gltf = await loadGLB('./'+file+'.glb'); }
      catch(e){ try { gltf = await loadGLB('./f_rugRectangle.glb'); } catch(e2){ continue; } }
      const obj = gltf.scene.clone(true);
      obj.traverse(o=>{ if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
      obj.position.set(r.x+dx, dy, r.z+dz);
      obj.rotation.y = rot*Math.PI/180;
      obj.scale.setScalar(s*2.0);
      scene.add(obj);
      if (/lamp/i.test(file)){
        const pl = new THREE.PointLight(0xffd9a0, 0.3, 7, 2);
        pl.position.set(r.x+dx, 1.4, r.z+dz);
        scene.add(pl); lampLights.push(pl);
      }
    }
  }
  furnitureFiles.forEach(()=>tick());
}

/* characters */
const chars = [];
async function buildCast(){
  const animGltf = await loadGLB('./web_anims.glb'); tick();
  const clips = animGltf.animations;
  const clip = n => clips.find(c=>c.name===n);
  for (const c of CAST){
    const bodyGltf = await loadGLB('./'+c.body);
    const root = SkeletonUtils.clone(bodyGltf.scene);
    const suitMat = new THREE.MeshStandardMaterial({ color:c.color, roughness:0.55, metalness:0.05 });
    root.traverse(o=>{ if (o.isMesh || o.isSkinnedMesh){ o.castShadow = true; o.frustumCulled = false;
      if (!/face|eye|brow/i.test(o.name)) o.material = suitMat; } });
    root.scale.setScalar(1.15);
    scene.add(root);
    /* hair: attach at T-pose */
    try {
      const hairGltf = await loadGLB('./'+c.hair);
      const hair = hairGltf.scene.clone(true);
      hair.traverse(o=>{ if (o.isMesh) o.castShadow = true; });
      let headBone = null;
      root.traverse(o=>{ if (!headBone && o.isBone && o.name==='Head') headBone = o; });
      if (headBone){ scene.add(hair); root.updateMatrixWorld(true); headBone.attach(hair); }
    } catch(e){}
    /* identity ring */
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.06, 24),
      new THREE.MeshBasicMaterial({ color:c.color }));
    ring.position.y = 0.05; root.add(ring);
    /* name tag + bubble */
    const tag = document.createElement('div'); tag.className='nametag';
    tag.textContent = c.name; tag.style.color = '#'+c.color.toString(16).padStart(6,'0');
    const tagObj = new CSS2DObject(tag); tagObj.position.set(0, 2.15, 0); root.add(tagObj);
    const bub = document.createElement('div'); bub.className='cbubble';
    const bubObj = new CSS2DObject(bub); bubObj.position.set(0, 2.6, 0); root.add(bubObj);
    /* plumbob for the Sim himself */
    let plumb = null;
    if (c.key === 'anar'){
      plumb = new THREE.Mesh(new THREE.OctahedronGeometry(0.2),
        new THREE.MeshStandardMaterial({ color:0x7ee08a, emissive:0x2a7a3a, roughness:0.25, metalness:0.2 }));
      plumb.position.y = 2.5; plumb.scale.y = 1.5; root.add(plumb);
    }
    /* mixer */
    const mixer = new THREE.AnimationMixer(root);
    const actions = {};
    for (const n of ['Idle_Loop','Idle_Talking_Loop','Walk_Loop','Walk_Formal_Loop','Sitting_Enter','Sitting_Idle_Loop','Sitting_Talking_Loop','Sitting_Exit','Interact','Dance_Loop','Fixing_Kneeling']){
      const cl = clip(n); if (cl) actions[n] = mixer.clipAction(cl);
    }
    const home = ROOMS.find(rr=>rr.key===c.home);
    const startX = home? home.x + (Math.random()*4-2) : 0;
    const startZ = home? home.z + (Math.random()*4-2) : 0.5;
    root.position.set(startX, 0.22, startZ);
    const ch = { cfg:c, root, mixer, actions, cur:null, plumb, state:'idle', t:1+Math.random()*3,
      target:null, speed:1.5, bub, bubT: Math.random()*14 };
    playAction(ch, 'Idle_Loop');
    chars.push(ch);
  }
  castFiles.forEach(()=>tick());
}
function playAction(ch, name, once){
  const a = ch.actions[name]; if (!a || ch.cur===a) return;
  a.reset();
  if (once){ a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; }
  else a.setLoop(THREE.LoopRepeat);
  if (ch.cur) { a.crossFadeFrom(ch.cur, 0.28, true); }
  a.play();
  ch.cur = a;
}

/* wander behavior */
function pickTarget(ch){
  const c = ch.cfg;
  let room;
  if (c.home && Math.random() < 0.72) room = ROOMS.find(r=>r.key===c.home);
  else room = ROOMS[Math.floor(Math.random()*ROOMS.length)];
  return new THREE.Vector3(room.x + (Math.random()*4.6-2.3), 0.22, room.z + (Math.random()*4.6-2.3));
}
let plumbT = 0;
function updateChar(ch, dt){
  ch.mixer.update(dt);
  if (ch.plumb){ plumbT += dt; ch.plumb.rotation.y += dt*1.6;
    ch.plumb.position.y = 2.5 + Math.sin(plumbT*2)*0.09;
    ch.plumb.material.color.set(moodColor(avgNeeds())); }
  ch.t -= dt;
  if (ch.state==='idle' && ch.t<=0){
    const roll = Math.random();
    if (roll < 0.62){ ch.target = pickTarget(ch); ch.state='walk';
      playAction(ch, Math.random()<0.25 ? 'Walk_Formal_Loop' : 'Walk_Loop'); }
    else if (roll < 0.74 && ch.actions['Interact']){ ch.state='act'; ch.t=2.2; playAction(ch,'Interact',true); }
    else if (roll < 0.80 && ch.actions['Fixing_Kneeling']){ ch.state='act'; ch.t=3.2; playAction(ch,'Fixing_Kneeling',true); }
    else if (roll < 0.84 && ch.actions['Dance_Loop']){ ch.state='act'; ch.t=4.5; playAction(ch,'Dance_Loop'); }
    else { ch.t = 3+Math.random()*5; }
  }
  else if (ch.state==='walk' && ch.target){
    const pos = ch.root.position;
    const dir = new THREE.Vector3().subVectors(ch.target, pos); dir.y = 0;
    const dist = dir.length();
    if (dist < 0.15){ ch.state='idle'; ch.t = 2.5+Math.random()*6; playAction(ch,'Idle_Loop'); }
    else {
      dir.normalize();
      pos.addScaledVector(dir, Math.min(ch.speed*dt, dist));
      const yaw = Math.atan2(dir.x, dir.z);
      let cy = ch.root.rotation.y;
      let dyaw = ((yaw - cy + Math.PI*3) % (Math.PI*2)) - Math.PI;
      ch.root.rotation.y = cy + dyaw * Math.min(1, dt*8);
    }
  }
  else if (ch.state==='act' && ch.t<=0){ ch.state='idle'; ch.t=2+Math.random()*4; playAction(ch,'Idle_Loop'); }
  /* bubble */
  ch.bubT -= dt;
  const show = ch.bubT <= 0 && ch.bubT > -6;
  if (ch.bubT <= -20) ch.bubT = 10+Math.random()*14;
  const st = DATA['agent-status'][ch.cfg.key];
  if (show && st){ ch.bub.textContent = st.activity || '…'; ch.bub.style.opacity = 1;
    if (ch.state==='idle') playAction(ch,'Idle_Talking_Loop'); }
  else { ch.bub.style.opacity = 0; if (ch.state==='idle' && ch.cur===ch.actions['Idle_Talking_Loop']) playAction(ch,'Idle_Loop'); }
}

/* ================= HUD / chips / terminal ================= */

refreshHUD(); refreshChips();

const termBody = $('termbody');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function pushLine(t, who, msg, dim){
  const ln = document.createElement('div'); ln.className='ln'+(dim?' dim':'');
  ln.innerHTML = '<span class="t">'+esc(t)+'</span> <span class="w-'+esc(who)+'">['+esc(who)+']</span> '+esc(msg);

(DATA['life-status'].events||[]).forEach(e=>{

  else pushLine(e.t||'·', e.who||'system', e.msg||'', false);

const AMBIENT = {
  'job-scout':['radar sweep... nominal','re-checking Canva careers','pinning a lead'],

/* ================= panels ================= */
function openPanel(html){ $('pbody').innerHTML = html; $('panelwrap').classList.add('open'); }
$('pclose').addEventListener('click', ()=> $('panelwrap').classList.remove('open'));
$('panelwrap').addEventListener('click', e=>{ if (e.target===$('panelwrap')) $('panelwrap').classList.remove('open'); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') $('panelwrap').classList.remove('open'); });
function agentRow(k){
  const st = DATA['agent-status'][k]||{}; const m = AGENT_META[k]||{};
  const cast = CAST.find(c=>c.key===k);
  return '<div class="row"><span class="lab">'+(cast?cast.name:k).toUpperCase()+' — '+esc(st.status||'')+'</span>'+
    esc(st.activity||'')+'<br><span style="color:#8a86a8;font-size:11px">'+esc(m.mission||'')+' · '+esc(m.sched||'')+'</span></div>';
}
function openRoomPanel(key){
  const r = ROOMS.find(x=>x.key===key); if (!r) return;
  const needs = DATA['life-status'].needs||{};
  const v = typeof needs[r.need]==='number'? needs[r.need] : 60;
  let html = '<h2>'+r.title+'</h2><div class="sub">LIFE NEED · '+v+'/100</div>';
  html += '<div class="row"><div class="bigtrack"><i style="width:'+v+'%;background-color:'+needColor(v)+'"></i></div></div>';
  for (const res of r.res) html += agentRow(res);
  html += '<div class="row"><span class="lab">HOW TO UPDATE</span>'+esc(ROOM_HOW[key]||'')+'</div>';
  openPanel(html);
}
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
canvas.addEventListener('pointerdown', e=>{ downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e=>{
  if (!downAt) return;
  const moved = Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]); downAt = null;
  if (moved > 6 || WALLPAPER) return;
  mouse.x = (e.clientX/window.innerWidth)*2-1; mouse.y = -(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  /* char hit? */
  const charRoots = chars.map(c=>c.root);
  const hitC = ray.intersectObjects(charRoots, true)[0];
  if (hitC){
    let node = hitC.object; while (node && !charRoots.includes(node)) node = node.parent;
    const ch = chars.find(c=>c.root===node);
    if (ch){ openPanel('<h2>'+ch.cfg.name+'</h2><div class="sub">RESIDENT</div>'+agentRow(ch.cfg.key)); blip(); return; }
  }
  const hitF = ray.intersectObjects(clickFloors, false)[0];
  if (hitF){ openRoomPanel(hitF.object.userData.roomKey); blip(); }
});

/* ================= sound ================= */
let audio = null, soundOn = false;
function blip(){ if (!soundOn || !audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type='square'; o.frequency.value = 660; g.gain.value = 0.03;
  o.connect(g); g.connect(audio.destination);
  o.start(); o.frequency.exponentialRampToValueAtTime(990, audio.currentTime+0.07);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime+0.12); o.stop(audio.currentTime+0.13);
}
let padTimer = null;
const SCALE = [220, 261.6, 293.7, 329.6, 392, 440];
function padNote(){
  if (!soundOn || !audio) return;
  const f = SCALE[Math.floor(Math.random()*SCALE.length)] * (Math.random()<0.3?2:1);
  const o = audio.createOscillator(), g = audio.createGain(), lp = audio.createBiquadFilter();
  o.type = 'triangle'; o.frequency.value = f;
  lp.type='lowpass'; lp.frequency.value = 900;
  g.gain.value = 0;
  o.connect(lp); lp.connect(g); g.connect(audio.destination);
  const t = audio.currentTime;
  g.gain.linearRampToValueAtTime(0.028, t+0.4);
  g.gain.linearRampToValueAtTime(0.0, t+2.6);
  o.start(); o.stop(t+2.7);
}
$('soundbtn').addEventListener('click', ()=>{
  if (!audio) audio = new (window.AudioContext||window.webkitAudioContext)();
  soundOn = !soundOn;
  $('soundbtn').textContent = soundOn ? '♪ SOUND: ON' : '♪ SOUND: OFF';
  if (soundOn){ padNote(); padTimer = setInterval(padNote, 1400); blip(); }
  else clearInterval(padTimer);
});

/* ================= main loop ================= */
const clock = new THREE.Clock();
const FPS_CAP = WALLPAPER ? 24 : 60;
let acc = 0, sway = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  acc += dt;
  if (acc < 1/FPS_CAP) return;
  const step = acc; acc = 0;
  for (const ch of chars) updateChar(ch, step);
  if (WALLPAPER){
    sway += step*0.05;
    const r = 27.7;
    camera.position.x = Math.sin(0.79 + Math.sin(sway)*0.07) * r;
    camera.position.z = Math.cos(0.79 + Math.sin(sway)*0.07) * r;
    camera.position.y = 18;
    camera.lookAt(0, 0, 0.6);
  } else if (controls) controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* ================= boot ================= */
(async ()=>{
  try {
    if (!renderer.getContext()) throw new Error('no webgl');
    await placeFurniture();
    await placeGarden();
    await buildCast();
    $('loader').style.opacity = 0;
    setTimeout(()=> $('loader').remove(), 900);
    animate();
  } catch(e){
    console.error(e);
    $('loadmsg').textContent = '3D unavailable — opening pixel mode…';
    setTimeout(()=> location.href = './pixel.html', 1200);
  }
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life HQ — Desktop</title>

<!-- Embedded snapshot. If a status.json file sits next to this page,
     it is polled every 60s and overrides these values.
     Test hooks: #t=22 forces the sky to 22:00 · #transparent hides scenery · #nohud hides the HUD -->
<script id="hq-status" type="application/json">
{
  "agent-status": {
    "job-scout":          { "status":"idle",  "activity":"First patrol tomorrow, 7:30" },
    "chief-of-staff":     { "status":"idle",  "activity":"First brief Tue, 7:35" },
    "application-writer": { "status":"ready", "activity":"Bring me a posting!" },
    "ypg-producer":       { "status":"idle",  "activity":"Next session Mon 9:00" },
    "anar":               { "status":"ready", "activity":"My agents work while I live" }
  },
  "life-status": {
    "week": "Week of Aug 10, 2026",
    "mood": 60,
    "needs": { "finances":60, "health":60, "career":60, "study":60, "social":60, "civic":60 },
    "events": [
      "Life HQ deployed — 4 cloud agents on staff",
      "Job Scout patrols daily 07:30",
      "Chief of Staff briefs weekdays 07:35",
      "YPG plan lands Mondays 09:00",
      "Life check-in Sundays 20:00 — reply to feed the bars"
    ]
  }
}
</script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
  body { font-family:'Courier New', Courier, monospace; }

  /* ---------- sky phases (backdrop mode) ---------- */
  body.backdrop.phase-night { background:linear-gradient(180deg,#04040d 0%,#0b0b20 45%,#141432 80%,#1a1a3a 100%); }
  body.backdrop.phase-dawn  { background:linear-gradient(180deg,#12122e 0%,#31264e 42%,#6e3f5c 72%,#c9764f 100%); }
  body.backdrop.phase-day   { background:linear-gradient(180deg,#3a6ab0 0%,#5d8cc4 55%,#8fb4dc 85%,#aac9e6 100%); }
  body.backdrop.phase-dusk  { background:linear-gradient(180deg,#16163a 0%,#41264e 45%,#7e3f54 74%,#d9824f 100%); }

  #stars { position:fixed; top:0; left:0; width:2px; height:2px; background:#fff; display:none; opacity:0; transition:opacity 2s;
    box-shadow: 8vw 6vh #fff, 18vw 12vh #cfd8ff, 27vw 4vh #fff, 36vw 15vh #ffe9b0, 45vw 8vh #fff,
      54vw 18vh #cfd8ff, 63vw 5vh #fff, 72vw 12vh #fff, 81vw 9vh #ffe9b0, 90vw 16vh #fff,
      12vw 26vh #fff, 33vw 30vh #cfd8ff, 58vw 28vh #fff, 78vw 32vh #cfd8ff, 95vw 24vh #fff,
      5vw 44vh #fff, 24vw 52vh #cfd8ff, 49vw 47vh #fff, 69vw 55vh #ffe9b0, 88vw 49vh #fff,
      15vw 60vh #fff, 41vw 63vh #cfd8ff, 66vw 58vh #fff, 92vw 62vh #ffe9b0; }
  body.backdrop #stars { display:block; }
  body.phase-night #stars { opacity:1; }
  body.phase-dawn #stars, body.phase-dusk #stars { opacity:.4; }
  body.phase-day #stars { opacity:0; }

  #orb { position:fixed; display:none; image-rendering:pixelated; z-index:1; }
  body.backdrop #orb { display:block; }

  .cloud { position:fixed; display:none; image-rendering:pixelated; z-index:2; opacity:.9; }
  body.backdrop .cloud { display:block; }
  body.phase-night .cloud { display:none; }
  @keyframes drift1 { from { left:-220px; } to { left:110vw; } }
  @keyframes drift2 { from { left:-260px; } to { left:110vw; } }
  #cloud1 { top:9vh;  animation:drift1 150s linear infinite; }
  #cloud2 { top:19vh; animation:drift2 210s linear infinite; animation-delay:-80s; }
  #cloud3 { top:31vh; animation:drift1 260s linear infinite; animation-delay:-160s; }

  #shoot { position:fixed; width:3px; height:3px; background:#fff; box-shadow:0 0 6px 2px #ffffff88; opacity:0; z-index:2; }
  #shoot.go { animation:shootanim 1.1s linear 1; }
  @keyframes shootanim {
    0% { opacity:0; transform:translate(0,0); }
    8% { opacity:1; }
    100% { opacity:0; transform:translate(-46vw,26vh); } }

  #skyline { position:fixed; left:0; bottom:12px; width:100vw; height:auto; display:none;
    image-rendering:pixelated; z-index:2; pointer-events:none; }
  body.backdrop #skyline { display:block; }
  #smoke { position:fixed; display:none; image-rendering:pixelated; z-index:2; pointer-events:none; }
  body.backdrop #smoke { display:block; }
  #bird { position:fixed; display:none; image-rendering:pixelated; z-index:3; }
  body.backdrop #bird { display:block; }

  #ground { position:fixed; left:0; right:0; bottom:0; height:14px; display:none; z-index:3;
    background:#2f5a2f; border-top:3px solid #0e0e1a;
    background-image:linear-gradient(90deg,#2f5a2f 0 12px,#38683a 12px 16px); background-size:24px 14px; }
  body.backdrop #ground { display:block; }
  body.phase-night #ground { filter:brightness(.55); }
  body.phase-dusk #ground, body.phase-dawn #ground { filter:brightness(.75); }

  .char { position:fixed; bottom:12px; image-rendering:pixelated; z-index:4; }
  .shadow { position:fixed; height:4px; background:rgba(0,0,0,.35); border-radius:2px; bottom:12px; z-index:3; }

  .bubble { position:fixed; background:#f4efdd; color:#1a1a2e; font-size:12px; font-weight:bold;
    padding:5px 9px; border:2px solid #1a1a2e; box-shadow:3px 3px 0 rgba(0,0,0,.45);
    white-space:nowrap; opacity:0; transition:opacity .4s; pointer-events:none; z-index:5; }
  .bubble::after { content:''; position:absolute; bottom:-8px; left:16px; width:0; height:0;
    border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid #1a1a2e; }
  .bubble .nm { color:#7a5a10; }

  #ticker { position:fixed; left:14px; bottom:24px; display:flex; align-items:center; gap:8px;
    background:rgba(10,10,22,.85); border:2px solid #06060e; box-shadow:3px 3px 0 rgba(0,0,0,.4);
    padding:6px 11px; font-size:11px; color:#c8c4e0; z-index:6; max-width:60vw; }
  #ticker .pulse { width:7px; height:7px; background:#7ee08a; flex:none; animation:blink 2s steps(1) infinite; }
  #ticker .txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #ticker b { color:#ffd75e; font-weight:bold; }
  @keyframes blink { 0%,60%{opacity:1} 61%,100%{opacity:.15} }

  /* ---------- needs HUD ---------- */
  #hud { position:fixed; top:44px; right:16px; z-index:6; background:rgba(12,12,26,.85);
    border:3px solid #06060e; box-shadow:0 0 0 2px #3a3a5a, 5px 5px 0 rgba(0,0,0,.45);
    padding:10px 12px; font-size:10px; color:#c8c4e0; min-width:172px; }
  #hud .hd { display:flex; align-items:center; gap:7px; margin-bottom:8px; letter-spacing:2px; color:#ffd75e; font-weight:bold; }
  #hud .hd canvas { image-rendering:pixelated; }
  #hud .hd .mood { margin-left:auto; font-size:9px; }
  #hud .nrow { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  #hud .nrow .lb { width:34px; color:#9a96b8; font-size:9px; letter-spacing:1px; }
  #hud .segs { display:flex; gap:2px; }
  #hud .segs i { width:9px; height:8px; background:#1a1a2e; border:1px solid #06060e; }
  #hud .wk { margin-top:7px; color:#6a6a90; font-size:9px; letter-spacing:1px; }
</style>
</head>
<body>
<div id="stars"></div>
<canvas id="orb" width="15" height="15" style="width:60px;height:60px;"></canvas>
<canvas id="cloud1" class="cloud" width="56" height="18" style="width:224px;height:72px;"></canvas>
<canvas id="cloud2" class="cloud" width="56" height="18" style="width:168px;height:54px;"></canvas>
<canvas id="cloud3" class="cloud" width="56" height="18" style="width:280px;height:90px;"></canvas>
<div id="shoot"></div>
<canvas id="skyline" width="480" height="90"></canvas>
<canvas id="smoke" width="34" height="40"></canvas>
<canvas id="bird" width="26" height="12" style="width:52px;height:24px;"></canvas>
<div id="ground"></div>
<div id="ticker"><span class="pulse"></span><span class="txt" id="tickertxt"><b>LIFE HQ</b> — agents on duty</span></div>
<div id="hud">
  <div class="hd"><canvas id="hudbob" width="10" height="12" style="width:20px;height:24px;"></canvas>LIFE HQ<span class="mood" id="hudmood">—</span></div>
  <div id="hudrows"></div>
  <div class="wk" id="hudwk"></div>
</div>

<script>
/* ============ status / hooks ============ */
var DATA = JSON.parse(document.getElementById('hq-status').textContent);
var HASH = location.hash || '';
var TRANSPARENT = HASH.indexOf('transparent') !== -1;
var NOHUD = HASH.indexOf('nohud') !== -1;
var FORCE_T = (function(){ var m = HASH.match(/t=([0-9.]+)/); return m ? parseFloat(m[1]) : null; })();
if (!TRANSPARENT) document.body.classList.add('backdrop');
if (NOHUD) document.getElementById('hud').style.display = 'none';

var ORDER = ['anar','job-scout','chief-of-staff','application-writer','ypg-producer'];
var NAMES = { 'anar':'ANAR','job-scout':'SCOUT','chief-of-staff':'ODKO','application-writer':'INK','ypg-producer':'TUYA' };
var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

function hourFrac(){ if (FORCE_T!==null) return FORCE_T; var d=new Date(); return d.getHours()+d.getMinutes()/60; }
function phaseOf(h){ if (h<5.5||h>=21.5) return 'night'; if (h<8.5) return 'dawn'; if (h<17.5) return 'day'; return 'dusk'; }
function clockStr(){ var d=new Date(); return DAYS[d.getDay()]+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

/* ============ sprites ============ */
var FRAME_A = [
"....HHHH....","...HHHHHH...","...HFFFFH...","...FEFFEF...","...FFFFFF...","....FFFF....",
"...TTTTTT...","..TTTTTTTT..",".ATTTTTTTTA.",".ATTTTTTTTA.","..TTTTTTTT..","...PPPPPP...",
"...PP..PP...","...PP..PP...","...PP..PP...","..OO....OO.."];
var FRAME_B = [
"....HHHH....","...HHHHHH...","...HFFFFH...","...FEFFEF...","...FFFFFF...","....FFFF....",
"...TTTTTT...","..TTTTTTTT..","AATTTTTTTTAA","..TTTTTTTT..","..TTTTTTTT..","...PPPPPP...",
"..PP....PP..","..PP....PP..",".PP......PP.","OO........OO"];
var CHARS = {
  'job-scout':          { H:'#5a3a20', F:'#e8b88a', E:'#221a10', T:'#a08c58', A:'#e8b88a', P:'#5c4a30', O:'#3a2a1a', hat:'#7a5c34' },
  'chief-of-staff':     { H:'#1a1410', F:'#e8b88a', E:'#221a10', T:'#2e3a5e', A:'#2e3a5e', P:'#22283e', O:'#141420', tie:'#c04040' },
  'application-writer': { H:'#6a4a2a', F:'#eec49a', E:'#221a10', T:'#3e6a48', A:'#3e6a48', P:'#4a4034', O:'#2a2018', glasses:'#101018' },
  'ypg-producer':       { H:'#100c0a', F:'#e0ae80', E:'#221a10', T:'#b03434', A:'#b03434', P:'#302838', O:'#181018', sash:'#ffd75e' },
  'anar':               { H:'#241a12', F:'#e8b88a', E:'#221a10', T:'#4a6ab0', A:'#4a6ab0', P:'#3a3444', O:'#20242e', hood:'#3a5490' }
};
function cellAt(g,r,c,f){ return g[r][f?11-c:c]; }
function drawSprite(ctx,key,frame,x,y,s,flip){
  var pal=CHARS[key], grid=frame?FRAME_B:FRAME_A;
  for (var r=0;r<16;r++) for (var c=0;c<12;c++){
    var ch=cellAt(grid,r,c,flip); if (ch==='.') continue;
    ctx.fillStyle=pal[ch]||'#fff'; ctx.fillRect(x+c*s,y+r*s,s,s);
  }
  if (pal.hat){ ctx.fillStyle=pal.hat; ctx.fillRect(x+2*s,y+1*s,8*s,s); ctx.fillRect(x+1*s,y+2*s,10*s,s); ctx.fillRect(x+3*s,y,6*s,s); }
  if (pal.tie){ ctx.fillStyle=pal.tie; ctx.fillRect(x+5*s,y+7*s,2*s,3*s); }
  if (pal.glasses){ ctx.fillStyle=pal.glasses; ctx.fillRect(x+3*s,y+3*s,6*s,s); }
  if (pal.sash){ ctx.fillStyle=pal.sash; ctx.fillRect(x+4*s,y+6*s,4*s,s); }
  if (pal.hood){ ctx.fillStyle=pal.hood; ctx.fillRect(x+2*s,y+5*s,8*s,s); ctx.fillRect(x+2*s,y+6*s,s,2*s); ctx.fillRect(x+9*s,y+6*s,s,2*s); }
}
var PLUMB_A=['..X..','.XXX.','XXXXX','.XXX.','..X..'], PLUMB_B=['..X..','..X..','.XXX.','..X..','..X..'];
function moodColor(v){ return v>=75?'#7ee08a':(v>=60?'#a8d878':(v>=45?'#ffd75e':(v>=30?'#ff9a5e':'#ff6b6b'))); }
function moodWord(v){ return v>=75?'ECSTATIC':(v>=60?'COMFY':(v>=45?'RESTLESS':(v>=30?'UNEASY':'DESPERATE'))); }
function drawPlumbob(ctx,cx,y,t,s,color){
  var g=(t%2)?PLUMB_B:PLUMB_A, bob=(t%4<2)?0:1;
  for (var r=0;r<5;r++) for (var c=0;c<5;c++) if (g[r][c]==='X'){
    ctx.fillStyle=(r===2&&c===2)?'#d8ffd8':color;
    ctx.fillRect(cx-Math.floor(2.5*s)+c*s, y+bob*s+r*s, s, s);
  }
}
function P(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

/* ============ sky: orb, clouds ============ */
var orbCtx = document.getElementById('orb').getContext('2d');
function drawOrb(kind){
  orbCtx.clearRect(0,0,15,15);
  if (kind==='sun'){
    P(orbCtx,4,2,7,11,'#ffd75e'); P(orbCtx,2,4,11,7,'#ffd75e'); P(orbCtx,3,3,9,9,'#ffd75e');
    P(orbCtx,5,4,3,3,'#ffe9a0');
    P(orbCtx,7,0,1,1,'#ffd75e'); P(orbCtx,7,14,1,1,'#ffd75e'); P(orbCtx,0,7,1,1,'#ffd75e'); P(orbCtx,14,7,1,1,'#ffd75e');
  } else {
    P(orbCtx,4,2,7,11,'#e8e8f0'); P(orbCtx,2,4,11,7,'#e8e8f0'); P(orbCtx,3,3,9,9,'#e8e8f0');
    P(orbCtx,5,5,3,3,'#b8b8cc'); P(orbCtx,9,8,2,2,'#b8b8cc'); P(orbCtx,7,4,2,2,'#c8c8dc');
  }
}
(function(){
  ['cloud1','cloud2','cloud3'].forEach(function(id,i){
    var c=document.getElementById(id).getContext('2d');
    P(c,8,8,40,6,'#ffffff'); P(c,14,4,18,6,'#ffffff'); P(c,30,6,12,4,'#f0f0f8');
    P(c,4,10,10,4,'#e8e8f4'); P(c,44,10,8,4,'#e8e8f4');
  });
})();

/* ============ skyline ============ */
var sky = document.getElementById('skyline');
var skyCtx = sky.getContext('2d');
var winSlots = [];   /* {x,y} in canvas coords */
function buildingRect(x,y,w,h,sil){ P(skyCtx,x,90-h,w,h,sil);
  for (var wy=90-h+4; wy<86; wy+=6) for (var wx=x+2; wx<x+w-3; wx+=5) winSlots.push({x:wx,y:wy});
}
function drawSkyline(phase){
  skyCtx.clearRect(0,0,480,90); winSlots = [];
  var sil = phase==='night' ? '#0a0a18' : phase==='day' ? '#33517a' : phase==='dawn' ? '#221c38' : '#241a30';
  var hill = phase==='night' ? '#070712' : phase==='day' ? '#2b4468' : '#1a1630';
  /* hills + gers (left) */
  P(skyCtx,0,74,150,16,hill); P(skyCtx,120,78,120,12,hill);
  [[16,70],[34,73],[58,68],[86,72],[110,75]].forEach(function(g){
    P(skyCtx,g[0],g[1],9,5,'#d8d4c8'); P(skyCtx,g[0]+3,g[1]-2,3,2,'#d8d4c8'); P(skyCtx,g[0]+3,g[1]+2,3,3,'#4a3a2a');
  });
  /* apartment blocks */
  buildingRect(150,0,26,34,sil); buildingRect(180,0,22,46,sil);
  /* blue sky tower (sail) */
  for (var i2=0;i2<30;i2++){
    var hh = 24 + Math.round(40*Math.sin((i2/30)*1.8));
    P(skyCtx,208+i2,90-hh,1,hh,sil);
  }
  /* mid towers */
  buildingRect(246,0,18,56,sil); buildingRect(268,0,26,38,sil); buildingRect(298,0,20,50,sil);
  P(skyCtx,252,30,6,4,'#c03030');  /* antenna light block */
  buildingRect(330,0,30,28,sil); buildingRect(364,0,22,40,sil);
  /* power plant (right) */
  P(skyCtx,398,62,72,28,sil);
  P(skyCtx,412,28,9,62,sil); P(skyCtx,440,36,9,54,sil);
  P(skyCtx,412,28,9,3,'#c03030'); P(skyCtx,412,34,9,3,'#e8e4d8');
  P(skyCtx,440,36,9,3,'#c03030'); P(skyCtx,440,42,9,3,'#e8e4d8');
  /* windows */
  var lit = phase==='night' ? 0.55 : phase==='dusk' ? 0.4 : phase==='dawn' ? 0.15 : 0;
  winSlots.forEach(function(s3,i3){
    if (lit>0 && ((i3*7+3)%20) < lit*20) P(skyCtx,s3.x,s3.y,3,3,'#ffd75e');
    else if (phase==='day') P(skyCtx,s3.x,s3.y,3,3,'rgba(255,255,255,.14)');
  });
}
/* smoke above chimney (canvas positioned by JS) */
var smoke = document.getElementById('smoke'), smokeCtx = smoke.getContext('2d');
function positionSkylineBits(){
  var scale = window.innerWidth/480;
  var skyH = 90*scale;
  smoke.style.width = (34*scale)+'px'; smoke.style.height = (40*scale)+'px';
  smoke.style.left = (404*scale)+'px';
  smoke.style.bottom = (12 + skyH - 30*scale) + 'px';
}
function drawSmoke(t, phase){
  smokeCtx.clearRect(0,0,34,40);
  var col = phase==='night' ? 'rgba(200,200,220,.25)' : 'rgba(240,240,248,.55)';
  var off = t%8;
  P(smokeCtx,10,34-off,4,4,col); P(smokeCtx,13,26-off,5,5,col); P(smokeCtx,9,17-off,6,6,col);
  P(smokeCtx,24,30-((t+4)%8),4,4,col); P(smokeCtx,26,21-((t+4)%8),5,5,col);
}

/* ============ bird ============ */
var bird = document.getElementById('bird'), birdCtx = bird.getContext('2d');
var birdState = { active:false, x:-60, y:120 };
function drawBird(frame){
  birdCtx.clearRect(0,0,26,12);
  var c='#1a1a26';
  if (frame){ P(birdCtx,2,4,4,2,c); P(birdCtx,6,6,4,2,c); P(birdCtx,10,4,4,2,c);
    P(birdCtx,16,6,4,2,c); P(birdCtx,20,4,4,2,c); }
  else { P(birdCtx,2,6,4,2,c); P(birdCtx,6,4,4,2,c); P(birdCtx,10,6,4,2,c);
    P(birdCtx,16,4,4,2,c); P(birdCtx,20,6,4,2,c); }
}

/* ============ HUD ============ */
var hudRows = document.getElementById('hudrows');
var HUD_LABELS = { finances:'FIN', health:'HP', career:'JOB', study:'EDU', social:'SOC', civic:'YPG' };
function renderHUD(t){
  var needs = (DATA['life-status']||{}).needs;
  if (!needs){ document.getElementById('hud').style.display='none'; return; }
  var vals = Object.keys(HUD_LABELS).map(function(k){ return needs[k]; }).filter(function(v){ return typeof v==='number'; });
  var avg = vals.length ? Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length) : 60;
  var html='';
  Object.keys(HUD_LABELS).forEach(function(k){
    var v = typeof needs[k]==='number' ? needs[k] : 60;
    var filled = Math.round(v/10), col = moodColor(v>=66?80:(v>=40?50:20));
    col = v>=66?'#7ee08a':(v>=40?'#ffd75e':'#ff6b6b');
    html += '<div class="nrow"><span class="lb">'+HUD_LABELS[k]+'</span><span class="segs">';
    for (var s4=0;s4<10;s4++) html += '<i style="'+(s4<filled?('background:'+col):'')+'"></i>';
    html += '</span></div>';
  });
  hudRows.innerHTML = html;
  var hm = document.getElementById('hudmood');
  hm.textContent = moodWord(avg); hm.style.color = moodColor(avg);
  document.getElementById('hudwk').textContent = (DATA['life-status'].week||'').toUpperCase();
  var hb = document.getElementById('hudbob').getContext('2d');
  hb.clearRect(0,0,10,12); drawPlumbob(hb,5,1,t||0,2,moodColor(avg));
}

/* ============ walkers ============ */
var S = Math.max(3, Math.min(6, Math.round(window.innerHeight/280)));
var SPR_W=12*S, SPR_H=16*S, PLUMB_H=6*S;
var walkers=[];
ORDER.forEach(function(key,i){
  var cv=document.createElement('canvas');
  var isAnar = key==='anar';
  cv.width=SPR_W; cv.height=SPR_H+(isAnar?PLUMB_H:0);
  cv.style.width=cv.width+'px'; cv.style.height=cv.height+'px';
  cv.className='char'; document.body.appendChild(cv);
  var sh=document.createElement('div'); sh.className='shadow';
  sh.style.width=(SPR_W*0.7)+'px'; document.body.appendChild(sh);
  var bb=document.createElement('div'); bb.className='bubble'; document.body.appendChild(bb);
  var span=Math.max(600, window.innerWidth-SPR_W-40);
  walkers.push({ key:key, cv:cv, ctx:cv.getContext('2d'), sh:sh, bb:bb, isAnar:isAnar,
    x:40+Math.floor(span*(i+0.5)/ORDER.length), dir:(i%2===0)?1:-1, speed:2+(i%3),
    pause:i*3, bubbleTick:i*22, hop:0 });
});

/* ============ main loop ============ */
var tick=0, curPhase=null;
function applyPhase(){
  var h=hourFrac(), ph=phaseOf(h);
  if (ph!==curPhase){
    document.body.classList.remove('phase-night','phase-dawn','phase-day','phase-dusk');
    document.body.classList.add('phase-'+ph);
    drawSkyline(ph);
    drawOrb(ph==='night'?'moon':'sun');
    curPhase=ph;
  }
  /* orb arc */
  var orb=document.getElementById('orb'), p;
  if (ph==='night'){ p=((h-21.5+24)%24)/8; } else { p=(h-5.5)/16; }
  p=Math.max(0,Math.min(1,p));
  orb.style.left = (6+p*84)+'vw';
  orb.style.top  = (52-44*Math.sin(p*Math.PI))+'vh';
}
function step(){
  var W=window.innerWidth;
  applyPhase();
  walkers.forEach(function(w,i){
    if (w.pause>0){ w.pause--; }
    else {
      w.x += w.dir*w.speed*S*0.5;
      if (w.x<20){ w.x=20; w.dir=1; w.pause=4+((tick+i)%6); }
      if (w.x>W-SPR_W-20){ w.x=W-SPR_W-20; w.dir=-1; w.pause=4+((tick+i)%6); }
      if ((tick+i*7)%53===0) w.pause=5+((tick+i)%8);
      if ((tick+i*11)%97===0) w.dir*=-1;
    }
    if ((tick+i*13)%47===0) w.hop=2;
    var hopY = w.hop>0 ? -S : 0; if (w.hop>0) w.hop--;
    var frame=(w.pause>0)?0:(tick%2);
    w.ctx.clearRect(0,0,w.cv.width,w.cv.height);
    var yOff=w.isAnar?PLUMB_H:0;
    drawSprite(w.ctx,w.key,frame,0,yOff+hopY,S,w.dir===-1);
    if (w.isAnar){
      var needs=(DATA['life-status']||{});
      drawPlumbob(w.ctx,Math.floor(SPR_W/2),0+hopY,tick,Math.max(2,S-2),moodColor(needs.mood||60));
    }
    w.cv.style.left=Math.round(w.x)+'px';
    w.sh.style.left=Math.round(w.x+SPR_W*0.15)+'px';
    w.bubbleTick++;
    var show=(w.bubbleTick%44)<12;
    if (show){
      var st=DATA['agent-status'][w.key];
      w.bb.innerHTML='<span class="nm">'+NAMES[w.key]+':</span> '+String(st&&st.activity||'...').replace(/</g,'&lt;');
      w.bb.style.left=Math.round(w.x-8)+'px';
      w.bb.style.bottom=(12+w.cv.height+12)+'px';
      w.bb.style.opacity=1;
    } else w.bb.style.opacity=0;
  });
  /* smoke + bird + shooting star */
  drawSmoke(tick, curPhase);
  if (curPhase!=='night'){
    if (!birdState.active && tick%61===17){ birdState.active=true; birdState.x=-60; birdState.y=Math.round(window.innerHeight*(0.18+((tick%5)*0.05))); }
    if (birdState.active){
      birdState.x+=10;
      drawBird(tick%2);
      bird.style.left=birdState.x+'px'; bird.style.top=birdState.y+'px';
      if (birdState.x>W+40) birdState.active=false;
      bird.style.opacity=1;
    } else bird.style.opacity=0;
  } else {
    bird.style.opacity=0;
    if (tick%89===31){
      var sh2=document.getElementById('shoot');
      sh2.style.left=(30+(tick%50))+'vw'; sh2.style.top=(6+(tick%14))+'vh';
      sh2.classList.remove('go'); void sh2.offsetWidth; sh2.classList.add('go');
    }
  }
  if (tick%20===0) renderHUD(tick);
  tick++;
}
positionSkylineBits();
window.addEventListener('resize', positionSkylineBits);
renderHUD(0);
step();
setInterval(step, 300);

/* ============ ticker ============ */
var tickerEl=document.getElementById('tickertxt'), tIdx=0;
function cycleTicker(){
  var ev=(DATA['life-status']||{}).events||[];
  var pool=['<b>LIFE HQ</b> — '+((DATA['life-status']||{}).week||'')].concat(
    ev.map(function(e){ return String(e).replace(/</g,'&lt;'); }));
  tickerEl.innerHTML='<b>'+clockStr()+'</b> · '+pool[tIdx%pool.length];
  tIdx++;
}
cycleTicker();
setInterval(cycleTicker, 6000);

/* ============ optional live file ============ */
function poll(){
  try {
    fetch('./status.json',{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      if (j&&j['agent-status']) DATA['agent-status']=j['agent-status'];
      if (j&&j['life-status'])  DATA['life-status'] =j['life-status'];
      renderHUD(tick);
    }).catch(function(){});
  } catch(e){}
}
poll();
setInterval(poll, 60000);
</script>

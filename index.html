    events:[ "Life HQ 3D — the dollhouse update" ]
  }
};
let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
let prevStatuses = {}, seenEvents = new Set();
function poll(){
  fetch('./status.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{
      if(j&&j['agent-status']){
        for (const k of Object.keys(j['agent-status'])){
          const ns = j['agent-status'][k].status;
          if (prevStatuses[k] && prevStatuses[k] !== ns && (ns==='done'||ns==='alert') && typeof celebrate==='function') celebrate(k);
          prevStatuses[k] = ns;
        }
        DATA['agent-status']=j['agent-status'];
      }
      if(j&&j['life-status']){
        DATA['life-status'] =j['life-status'];
        for (const e of (j['life-status'].events||[])){
          const str = typeof e==='string'? e : JSON.stringify(e);
          if (!seenEvents.has(str) && seenEvents.size){ 
            if (typeof pushLine==='function'){
              const m = String(typeof e==='string'?e:(e.msg||'')).slice(0,120);
              pushLine('now', (typeof e==='object'&&e.who)||'system', m, false);
            }
          }
          seenEvents.add(str);
        }
      }
      refreshHUD(); refreshChips();
    })
    .catch(()=>{});
}
poll(); setInterval(poll, 60000);

function needColor(v){ return v>=66 ? '#7ee08a' : (v>=40 ? '#ffd75e' : '#ff6b6b'); }

function moodColor(v){ return v>=75?'#7ee08a':(v>=60?'#a8d878':(v>=45?'#ffd75e':(v>=30?'#ff9a5e':'#ff6b6b'))); }
function avgNeeds(){ const n=DATA['life-status'].needs||{}; const vs=Object.values(n).filter(x=>typeof x==='number');
  return vs.length? Math.round(vs.reduce((a,b)=>a+b,0)/vs.length) : 60; }
function hourFrac(){ const m=(location.hash.match(/t=([0-9.]+)/)); if(m) return parseFloat(m[1]);
  const d=new Date(); return d.getHours()+d.getMinutes()/60; }
function phaseOf(h){ return (h<5.5||h>=21.5)?'night':(h<8.5?'dawn':(h<17.5?'day':'dusk')); }

  { key:'social',   title:'LIVING',   need:'social',   rect:[3,-16,16,-4], res:[] }
];
for (const r of ROOMS){
  const [a,b,c,d] = r.rect;
  r.x = (a+c)/2; r.z = (b+d)/2;
  r.hx = (c-a)/2 - 0.25; r.hz = (d-b)/2 - 0.25;
  /* scale factors that map the original ±3.8 local coords into this room */
  r.sx = r.hx/3.55; r.sz = r.hz/3.55;
}
function roomAt(pos){
  for (const r of ROOMS){
    const [a,b,c,d] = r.rect;
    if (pos.x>=a && pos.x<=c && pos.z>=b && pos.z<=d) return r;
  }
  return null;

function buildComposer(){

    scale: 1.0, samples: 16, screenSpaceRadius: false });
  gtao.blendIntensity = 0.9;

  composer.addPass(gtao);
  bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.32, 0.85, 0.92);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}

/* ---- procedural material textures: warm oak, cream plaster, tile, shingle ---- */
function cvsTex(w, h, draw, rx, ry, srgb){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx||1, ry||1);
  t.anisotropy = 8;
  if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function planks(base, dark, lines, vertical){
  return cvsTex(256, 256, (g,w,h)=>{
    g.fillStyle = base; g.fillRect(0,0,w,h);
    const N = 8, step = h/N;
    for (let i=0;i<N;i++){
      /* alternate plank tone slightly so it never looks like flat colour */
      const t = 0.5 + 0.5*Math.sin(i*2.7);
      g.fillStyle = `rgba(0,0,0,${0.03 + t*0.05})`;
      if (vertical) g.fillRect(i*step, 0, step, h); else g.fillRect(0, i*step, w, step);
      /* grain */
      for (let k=0;k<26;k++){
        const a = 0.018 + Math.abs(Math.sin(i*3.1+k))*0.03;
        g.strokeStyle = `rgba(90,60,30,${a})`; g.lineWidth = 1;
        g.beginPath();
        if (vertical){ const x = i*step + ((k*9.7)%step); g.moveTo(x,0); g.lineTo(x + Math.sin(k)*3, h); }
        else { const y = i*step + ((k*9.7)%step); g.moveTo(0,y); g.lineTo(w, y + Math.sin(k)*3); }
        g.stroke();
      }
      g.strokeStyle = lines; g.lineWidth = 1.6;
      g.beginPath();
      if (vertical){ g.moveTo(i*step,0); g.lineTo(i*step,h); } else { g.moveTo(0,i*step); g.lineTo(w,i*step); }
      g.stroke();
    }
    g.fillStyle = dark; g.globalAlpha = 0.05; g.fillRect(0,0,w,h); g.globalAlpha = 1;
  }, 1, 1);
}

let realLightBudget = 8;
function addLamp(x, y, z, mult, real){
  /* A forward renderer evaluates every point light in every fragment shader, so the
     light count is the single biggest cost here. Only `real` lamps get a PointLight;
     everything else is a cheap additive glow sprite. */
  if (real && realLightBudget > 0){
    realLightBudget--;
    const pl = new THREE.PointLight(0xffc98a, 0, 16, 2);
    pl.position.set(x, y, z); pl.userData.mult = mult||1; scene.add(pl); lampLights.push(pl);
  }
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:GLOW_TEX, color:0xffcf94,
    transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false }));
  sp.position.set(x, y, z); sp.scale.set(2.2, 2.2, 1); sp.userData.mult = mult||1;
  sp.visible = false; sp.renderOrder = 5; sp.layers.set(0);
  scene.add(sp); glowSprites.push(sp);
}

  /* batten strips give the wall real relief so AO and shadows catch on it */

function hangArt(horiz, cx, cz, y, faceSign, w, hgt, texIdx){
  const grp = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(horiz?w+0.08:0.05, hgt+0.08, horiz?0.05:w+0.08), FRAME_MAT);
  const art = new THREE.Mesh(new THREE.BoxGeometry(horiz?w:0.02, hgt, horiz?0.02:w),
    new THREE.MeshStandardMaterial({ map: ART_TEX[texIdx % ART_TEX.length], roughness:0.9 }));
  frame.position.set(0,0,0); art.position.set(horiz?0:0.02*faceSign, 0, horiz?0.02*faceSign:0);
  grp.add(frame); grp.add(art);
  grp.position.set(cx + (horiz?0:(T/2+0.03)*faceSign), y, cz + (horiz?(T/2+0.03)*faceSign:0));

function dressWall(horiz, L, cx, cz, yBase, h, group){
  if (L < 1.6 || h < 1.6) return;
  const g = group || houseGroup;
  for (const faceSign of [-1, 1]){
    const roll = rnd();
    if (roll < 0.22) continue;                       /* leave some walls bare */
    if (roll < 0.55){
      /* a cluster of two or three frames */
      const n = 2 + (rnd() > 0.6 ? 1 : 0);
      for (let i=0;i<n;i++){
        const off = (i - (n-1)/2) * 0.62;
        const w = 0.34 + rnd()*0.16, hh = 0.4 + rnd()*0.2;
        const y = yBase + 1.42 + (i%2 ? 0.16 : -0.1);
        if (Math.abs(off) > L/2 - 0.4) continue;
        g.add(hangArt(horiz, horiz?cx+off:cx, horiz?cz:cz+off, y, faceSign, w, hh, (i*3+Math.floor(rnd()*6))|0));
      }
    } else if (roll < 0.78){
      /* one larger picture */
      const w = Math.min(L*0.45, 1.0), hh = w*0.78;
      g.add(hangArt(horiz, cx, cz, yBase + 1.5, faceSign, w, hh, Math.floor(rnd()*6)));
    } else {
      /* floating shelf with a couple of objects */
      const w = Math.min(L*0.5, 1.1);
      const sh = new THREE.Mesh(new THREE.BoxGeometry(horiz?w:0.2, 0.06, horiz?0.2:w), SHELF_MAT);
      sh.position.set(cx + (horiz?0:(T/2+0.09)*faceSign), yBase+1.38, cz + (horiz?(T/2+0.09)*faceSign:0));
      sh.castShadow = true; g.add(sh);
      for (let i=0;i<3;i++){
        const bw = 0.06 + rnd()*0.05, bh = 0.14 + rnd()*0.12;
        const bk = new THREE.Mesh(new THREE.BoxGeometry(horiz?bw:0.1, bh, horiz?0.1:bw),
          new THREE.MeshStandardMaterial({ color:[0x8a6a45,0x7d8f6e,0xc08a72,0x8a94ad][i%4], roughness:0.85 }));
        const off = (i-1)*0.17;
        bk.position.set((horiz?cx+off:cx) + (horiz?0:(T/2+0.09)*faceSign), yBase+1.41+bh/2,
                        (horiz?cz:cz+off) + (horiz?(T/2+0.09)*faceSign:0));
        bk.castShadow = true; g.add(bk);
      }
    }
    /* a sconce on roughly a third of the faces */
    if (rnd() < 0.34){
      const sx = cx + (horiz?0:(T/2+0.07)*faceSign), sz = cz + (horiz?(T/2+0.07)*faceSign:0);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.05), SCONCE_MAT);
      arm.position.set(sx, yBase+2.05, sz); g.add(arm);
      const shade = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.18, 10),
        new THREE.MeshStandardMaterial({ color:0xf2e3c6, roughness:0.9, emissive:0xffcf8a, emissiveIntensity:0 }));
      shade.position.set(sx, yBase+2.0, sz); shade.rotation.x = Math.PI; g.add(shade);
      litWindows.push(shade.material);
      addLamp(sx, yBase+1.95, sz, 0.7);
    }
  }
}

  let target = opts.group || houseGroup;
  /* Near walls would hide the interior in cutaway view. Instead of squashing them
     (which left windows and curtains floating in mid-air), build the real wall and a
     separate low stub, and swap whole groups. */
  if (opts.near){
    const full = new THREE.Group(), stub = new THREE.Group();
    target.add(full); target.add(stub);
    nearGroups.push({ full, stub });
    const sh = Math.min(LOW, h), sL = Math.abs(len);
    const scx = horiz ? (x1+x2)/2 : x1, scz = horiz ? z1 : (z1+z2)/2;
    const sw = new THREE.Mesh(new THREE.BoxGeometry(horiz?sL:T, sh, horiz?T:sL), mat);
    sw.position.set(scx, yBase + sh/2, scz);
    sw.castShadow = true; sw.receiveShadow = true; stub.add(sw);
    capWall(horiz, sL, scx, scz, yBase + sh, stub);
    const sk = new THREE.Mesh(new THREE.BoxGeometry(horiz?sL:T+0.06, 0.14, horiz?T+0.06:sL), MAT.trimPale);
    sk.position.set(scx, yBase + 0.07, scz); stub.add(sk);
    target = full;
  }
  const segs = []; let cur = 0;
  for (const g of (gaps||[]).slice().sort((a,b)=>a.c-b.c)){
    segs.push([cur, g.c - g.w/2, null]); segs.push([g.c - g.w/2, g.c + g.w/2, g]); cur = g.c + g.w/2;
  }
  segs.push([cur, Math.abs(len), null]);
  for (const [a,b,g] of segs){
    const L = b - a; if (L <= 0.015) continue;
    const mid = (a+b)/2;
    const cx = horiz ? x1 + dir*mid : x1;
    const cz = horiz ? z1 : z1 + dir*mid;
    const add = (hh, yy, m) => {
      const w = new THREE.Mesh(new THREE.BoxGeometry(horiz?L:T, hh, horiz?T:L), m||mat);
      w.position.set(cx, yy + hh/2, cz);
      w.castShadow = true; w.receiveShadow = true;
      target.add(w);
      return w;
    };
    if (!g){
      add(h, yBase);
      capWall(horiz, L, cx, cz, yBase + h, target);
      if (opts.skirt !== false){
        const sk = new THREE.Mesh(new THREE.BoxGeometry(horiz?L:T+0.06, 0.14, horiz?T+0.06:L), MAT.trimPale);
        sk.position.set(cx, yBase + 0.07, cz); target.add(sk);
      }
      if (opts.dress !== false) dressWall(horiz, L, cx, cz, yBase, h, target);
    } else if (g.win){
      const sillH = g.sill != null ? g.sill : 0.85, headH = g.head != null ? g.head : 2.25;
      add(sillH, yBase);
      if (h > headH){ add(h - headH, yBase + headH); capWall(horiz, L, cx, cz, yBase + h, target); }
      const gl = new THREE.Mesh(new THREE.BoxGeometry(horiz?L:0.06, headH-sillH, horiz?0.06:L), MAT.glass.clone());
      gl.position.set(cx, yBase + (sillH+headH)/2, cz); target.add(gl);
      gl.material.emissive = new THREE.Color(0xffcf8a); gl.material.emissiveIntensity = 0;
      litWindows.push(gl.material);
      /* sill board inside and out */
      for (const off of [0.13, -0.13]){
        const sb = new THREE.Mesh(new THREE.BoxGeometry(horiz?L+0.16:0.2, 0.07, horiz?0.2:L+0.16), MAT.trimPale);
        sb.position.set(cx + (horiz?0:off), yBase + sillH + 0.035, cz + (horiz?off:0));
        sb.castShadow = true; target.add(sb);
      }
      const fr = (w2,h2,x3,y3)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w2,h2,0.1), MAT.mullion);
        m.position.set(x3,y3,cz); m.castShadow = true; target.add(m); return m; };
      if (horiz){
        fr(L, 0.1, cx, yBase+sillH); fr(L, 0.1, cx, yBase+headH);
        const n = Math.max(1, Math.round(L/1.5));
        for (let i=0;i<=n;i++){ const m = new THREE.Mesh(new THREE.BoxGeometry(0.09, headH-sillH, 0.12), MAT.mullion);
          m.position.set(cx - L/2 + L*i/n, yBase+(sillH+headH)/2, cz); m.castShadow = true; target.add(m); }
      } else {
        const bar = (yy)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, L), MAT.mullion);
          m.position.set(cx, yy, cz); m.castShadow = true; target.add(m); };
        bar(yBase+sillH); bar(yBase+headH);
        const n = Math.max(1, Math.round(L/1.5));
        for (let i=0;i<=n;i++){ const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, headH-sillH, 0.09), MAT.mullion);
          m.position.set(cx, yBase+(sillH+headH)/2, cz - L/2 + L*i/n); m.castShadow = true; target.add(m); }
      }
      if (opts.curtains !== false) curtains(horiz, L, cx, cz, yBase, sillH, headH, target);
    } else if (g.head != null){
      if (h > g.head){ add(h - g.head, yBase + g.head); capWall(horiz, L, cx, cz, yBase + h, target); }
      /* header beam across the opening */
      const hd = new THREE.Mesh(new THREE.BoxGeometry(horiz?L:T+0.08, 0.16, horiz?T+0.08:L), MAT.trimOak);
      hd.position.set(cx, yBase + g.head - 0.08, cz); hd.castShadow = true; target.add(hd);
    }
  }
}

const doorFrames = [];
const doorLeafMat = new THREE.MeshStandardMaterial({ color:0xc08b53, roughness:0.72 });
const doorFrontMat= new THREE.MeshStandardMaterial({ color:0x6f8a72, roughness:0.7 });
const knobMat     = new THREE.MeshStandardMaterial({ color:0xd8bd82, roughness:0.35, metalness:0.65 });
function buildDoor(d){
  const w = d.w || 1.15, yb = d.y || 0, h = d.h || 2.15;
  const g = new THREE.Group();
  g.position.set(d.x, yb, d.z); g.rotation.y = (d.rot||0)*Math.PI/180;
  for (const sx of [-1,1]){
    const j = new THREE.Mesh(new THREE.BoxGeometry(0.13, h, T+0.1), MAT.trimOak);
    j.position.set(sx*(w/2+0.065), h/2, 0); j.castShadow = true; g.add(j);
  }
  const head = new THREE.Mesh(new THREE.BoxGeometry(w+0.26, 0.14, T+0.12), MAT.trimOak);
  head.position.set(0, h+0.07, 0); head.castShadow = true; g.add(head);
  const hinge = new THREE.Group();
  hinge.position.set(-w/2, 0, 0);
  hinge.rotation.y = (d.swing != null ? d.swing : 100) * Math.PI/180;
  const leaf = new THREE.Mesh(new THREE.BoxGeometry(w-0.03, h-0.06, 0.07), d.front ? doorFrontMat : doorLeafMat);
  leaf.position.set((w-0.03)/2, (h-0.06)/2, 0); leaf.castShadow = true; hinge.add(leaf);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), knobMat);
  knob.position.set(w-0.14, h*0.47, 0.07); hinge.add(knob);
  g.add(hinge); houseGroup.add(g);
}

/* ================= gable roofs + chimney ================= */
function gableRoof(x0, z0, x1, z1, wallTop, rise, ridgeAlongX, overhang){
  const o = overhang != null ? overhang : 0.75;
  const g = new THREE.Group(); roofGroup.add(g);
  const X0 = x0-o, X1 = x1+o, Z0 = z0-o, Z1 = z1+o;
  const spanW = ridgeAlongX ? (Z1-Z0) : (X1-X0);
  const runL  = ridgeAlongX ? (X1-X0) : (Z1-Z0);
  const half  = spanW/2;
  const slopeLen = Math.hypot(half, rise);
  const ang = Math.atan2(rise, half);
  const cx = (X0+X1)/2, cz = (Z0+Z1)/2;
  for (const s of [-1, 1]){
    const p = new THREE.Mesh(new THREE.BoxGeometry(ridgeAlongX?runL:slopeLen, 0.2, ridgeAlongX?slopeLen:runL),
      stdMat(TEX.shingle, (ridgeAlongX?runL:slopeLen)/3.2, (ridgeAlongX?slopeLen:runL)/3.2));
    if (ridgeAlongX){ p.position.set(cx, wallTop + rise/2, cz + s*half/2); p.rotation.x = -s*ang; }
    else { p.position.set(cx + s*half/2, wallTop + rise/2, cz); p.rotation.z = s*ang; }
    p.castShadow = true; p.receiveShadow = true; g.add(p);
    /* fascia board along the eave */
    const f = new THREE.Mesh(new THREE.BoxGeometry(ridgeAlongX?runL:0.16, 0.3, ridgeAlongX?0.16:runL), MAT.trimPale);
    if (ridgeAlongX) f.position.set(cx, wallTop-0.06, cz + s*half);
    else f.position.set(cx + s*half, wallTop-0.06, cz);
    f.castShadow = true; g.add(f);
  }
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(ridgeAlongX?runL:0.34, 0.22, ridgeAlongX?0.34:runL), MAT.shingle);
  ridge.position.set(cx, wallTop + rise + 0.05, cz); ridge.castShadow = true; g.add(ridge);
  /* gable end infill triangles */
  const sh = new THREE.Shape();
  sh.moveTo(-half, 0); sh.lineTo(half, 0); sh.lineTo(0, rise); sh.lineTo(-half, 0);
  const tri = new THREE.ExtrudeGeometry(sh, { depth:0.14, bevelEnabled:false });
  for (const e of [0, 1]){
    const m = new THREE.Mesh(tri, MAT.render);
    if (ridgeAlongX){ m.position.set(e ? X1 : X0, wallTop, cz); m.rotation.y = Math.PI/2; }
    else { m.position.set(cx, wallTop, e ? Z1 : Z0); }
    m.castShadow = true; g.add(m);
  }
  return g;
}
const MAIN_TOP = H_G + H_U;                    /* 5.7 */

/* ================= terrace, pool, outdoor living ================= */
const POOL = { x0:2.0, x1:15.0, z0:3.4, z1:11.0, depth:1.4 };
const POOL_SURFACE = -0.30;
const DECK_Y = 0.02;      /* deck top + foot offset */
const COURT_Y = -0.16;    /* court surface + foot offset */
const DECK = { x0:-12.0, x1:19.5, z0:-4.0, z1:13.6 };
function buildOutdoors(){
  /* timber deck */
  const M = 0.75;   /* coping margin around the pool */
  const strips = [
    [DECK.x0, DECK.z0, DECK.x1, POOL.z0-M],
    [DECK.x0, POOL.z1+M, DECK.x1, DECK.z1],
    [DECK.x0, POOL.z0-M, POOL.x0-M, POOL.z1+M],
    [POOL.x1+M, POOL.z0-M, DECK.x1, POOL.z1+M]
  ];
  for (const [a,b,c,d] of strips){
    const w2 = c-a, d2 = d-b; if (w2 <= 0.05 || d2 <= 0.05) continue;
    const dk = new THREE.Mesh(new THREE.BoxGeometry(w2, 0.34, d2), stdMat(TEX.deck, w2/2.4, d2/2.4));
    dk.position.set((a+c)/2, -0.3, (b+d)/2); dk.receiveShadow = true; dk.castShadow = true; scene.add(dk);
  }
  /* pool: shell, coping, water */
  const pw = POOL.x1-POOL.x0, pd = POOL.z1-POOL.z0, cx = (POOL.x0+POOL.x1)/2, cz = (POOL.z0+POOL.z1)/2;
  const poolTile = new THREE.MeshStandardMaterial({ color:0x8fd3e0, roughness:0.35 });
  const shell = new THREE.Mesh(new THREE.BoxGeometry(pw, POOL.depth, pd), poolTile);
  shell.position.set(cx, -0.62 - POOL.depth/2, cz); shell.receiveShadow = false; scene.add(shell);
  for (const [w2,d2,x2,z2] of [[pw+1.5,0.75,cx,POOL.z0-0.375],[pw+1.5,0.75,cx,POOL.z1+0.375],
                               [0.75,pd+1.5,POOL.x0-0.375,cz],[0.75,pd+1.5,POOL.x1+0.375,cz]]){
    const cop = new THREE.Mesh(new THREE.BoxGeometry(w2, 0.36, d2), MAT.stone);
    cop.position.set(x2, -0.30, z2); cop.receiveShadow = true; cop.castShadow = true; scene.add(cop);
  }
  /* water: a mipmapped caustic sheet over a graded blue base — no per-pixel
     sine lattice, so it never aliases into blobs at this zoom */
  /* caustics drawn on a jittered grid so coverage is even — random scattering left
     big empty patches, which read as dark blotches once composited over the water */
  const causticTex = cvsTex(512, 512, (g,w,h)=>{
    g.clearRect(0,0,w,h);
    g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineCap = 'round'; g.lineJoin = 'round';
    const N = 13, cell = w/N;
    for (let gy=-1; gy<=N; gy++){
      for (let gx=-1; gx<=N; gx++){
        const cx = (gx+0.5)*cell + (Math.random()-0.5)*cell*0.7;
        const cy = (gy+0.5)*cell + (Math.random()-0.5)*cell*0.7;
        g.lineWidth = 1.6 + Math.random()*3.4;
        g.beginPath();
        const r = cell*(0.5 + Math.random()*0.45);
        const a0 = Math.random()*6.28;
        g.moveTo(cx + Math.cos(a0)*r, cy + Math.sin(a0)*r);
        for (let k=1;k<=4;k++){
          const a = a0 + k*1.4 + Math.random()*0.9;
          const rr = r*(0.55 + Math.random()*0.7);
          g.quadraticCurveTo(cx + Math.cos(a-0.6)*rr*1.2, cy + Math.sin(a-0.6)*rr*1.2,
                             cx + Math.cos(a)*rr,          cy + Math.sin(a)*rr);
        }
        g.stroke();
      }
    }
  });
  causticTex.wrapS = causticTex.wrapT = THREE.RepeatWrapping;
  const baseW = new THREE.Mesh(new THREE.PlaneGeometry(pw-0.08, pd-0.08),
    new THREE.MeshStandardMaterial({ color:0x2a8fb4, roughness:0.14, metalness:0.05,
      transparent:true, opacity:0.92 }));
  baseW.rotation.x = -Math.PI/2; baseW.position.set(cx, -0.315, cz);
  baseW.receiveShadow = false; scene.add(baseW);
  const plight = new THREE.PointLight(0x54c8e8, 0, 14, 2);
  plight.position.set(cx, -0.8, cz); plight.userData.mult = 2.0; scene.add(plight); lampLights.push(plight);
  poolWater = new THREE.Mesh(new THREE.PlaneGeometry(pw-0.1, pd-0.1, 32, 20),
    new THREE.ShaderMaterial({
      transparent:true, depthWrite:false,
      uniforms:{ uTime:{value:0},
                 uA:{value:new THREE.Color(0x2a93b8)}, uB:{value:new THREE.Color(0x7fd8ea)} },
      vertexShader:`uniform float uTime; varying vec2 vUv; varying float vW;
        void main(){ vUv=uv; vec3 p=position;
          float w = sin(p.x*1.5+uTime*1.0)*0.032 + sin(p.y*2.1-uTime*0.75)*0.026;
          p.z += w; vW = w;
          gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0); }`,
      fragmentShader:`uniform float uTime; uniform vec3 uA,uB;
        varying vec2 vUv; varying float vW;
        void main(){
          /* Domain-warped sines instead of a tiled texture: the previous version
             repeated every 2.5 units and each tile had a low-coverage centre, which
             showed up as a regular lattice of dark blobs across the pool. */
          vec2 p = vUv * vec2(13.0, 7.6);
          float t = uTime * 0.6;
          float wx = sin(p.y*1.31 - t*0.83) * 1.7;
          float wy = sin(p.x*0.97 + t*0.61) * 1.5;
          float n  = sin(p.x*2.37 + wx + t*1.07);
          n       += sin(p.y*3.11 + wy - t*0.89);
          n       += sin((p.x*1.63 + p.y*2.11) + (wx+wy)*0.5 + t*0.53);
          float c = smoothstep(0.55, 2.45, n + 1.6);
          float edge = min(min(vUv.x, 1.0-vUv.x), min(vUv.y, 1.0-vUv.y));
          float shallow = 1.0 - smoothstep(0.0, 0.22, edge);
          vec3 tint = mix(uB, vec3(0.92,0.99,1.0), 0.55);
          float a = c*0.5 + shallow*0.14 + max(0.0, vW)*1.2;
          gl_FragColor = vec4(tint, clamp(a, 0.0, 0.75)); }`
    }));
  poolWater.rotation.x = -Math.PI/2; poolWater.position.set(cx, -0.30, cz); scene.add(poolWater);
}
buildOutdoors();

const COURT = { x0:23.5, x1:36.5, z0:-14.5, z1:8.5 };
function buildTennis(){
  const pw = 8.4, pd = 18.0;                       /* playing surface */
  const cx = (COURT.x0+COURT.x1)/2, cz = (COURT.z0+COURT.z1)/2;
  /* outer apron */
  const apron = new THREE.Mesh(new THREE.BoxGeometry(COURT.x1-COURT.x0, 0.3, COURT.z1-COURT.z0),
    new THREE.MeshStandardMaterial({ color:0x2f6b52, roughness:0.95 }));
  apron.position.set(cx, -0.44, cz); apron.receiveShadow = true; scene.add(apron);
  /* playing surface with markings drawn to scale */
  const lineTex = cvsTex(512, 1024, (g,w,h)=>{
    g.fillStyle = '#2b6ea8'; g.fillRect(0,0,w,h);
    g.strokeStyle = '#ffffff'; g.lineJoin = 'miter';
    const m = 26;                                   /* doubles sideline inset */
    const L = w - m*2, D = h - m*2;
    g.lineWidth = 7;
    g.strokeRect(m, m, L, D);                        /* doubles court */
    const sing = m + L*0.115;
    g.beginPath(); g.moveTo(sing, m); g.lineTo(sing, m+D);
    g.moveTo(w-sing, m); g.lineTo(w-sing, m+D); g.stroke();   /* singles sidelines */
    const svc = D*0.235;
    g.beginPath(); g.moveTo(sing, m+svc); g.lineTo(w-sing, m+svc);
    g.moveTo(sing, m+D-svc); g.lineTo(w-sing, m+D-svc); g.stroke();  /* service lines */
    g.beginPath(); g.moveTo(w/2, m+svc); g.lineTo(w/2, m+D-svc); g.stroke();  /* centre service */
    g.lineWidth = 9;
    g.beginPath(); g.moveTo(w/2-16, m+2); g.lineTo(w/2+16, m+2);
    g.moveTo(w/2-16, m+D-2); g.lineTo(w/2+16, m+D-2); g.stroke();     /* centre marks */
  }, 1, 1);
  const surf = new THREE.Mesh(new THREE.PlaneGeometry(pw, pd),
    new THREE.MeshStandardMaterial({ map:lineTex, roughness:0.9 }));
  surf.rotation.x = -Math.PI/2; surf.position.set(cx, -0.28, cz); surf.receiveShadow = true; scene.add(surf);
  /* net */
  const netTex = cvsTex(64, 32, (g,w,h)=>{
    g.clearRect(0,0,w,h); g.strokeStyle='rgba(20,20,20,0.85)'; g.lineWidth=1.5;
    for(let i=0;i<=8;i++){ g.beginPath(); g.moveTo(i*w/8,0); g.lineTo(i*w/8,h); g.stroke(); }
    for(let j=0;j<=4;j++){ g.beginPath(); g.moveTo(0,j*h/4); g.lineTo(w,j*h/4); g.stroke(); }
  }, 12, 4);
  netTex.colorSpace = THREE.SRGBColorSpace;
  const net = new THREE.Mesh(new THREE.PlaneGeometry(pw+1.0, 1.07),
    new THREE.MeshStandardMaterial({ map:netTex, alphaMap:netTex, transparent:true,
      side:THREE.DoubleSide, roughness:0.9, color:0x1b1b1b }));
  net.position.set(cx, -0.28+0.535, cz); scene.add(net);
  const tape = new THREE.Mesh(new THREE.BoxGeometry(pw+1.0, 0.09, 0.07), MAT.trimPale);
  tape.position.set(cx, -0.28+1.07, cz); tape.castShadow = true; scene.add(tape);
  for (const s of [-1,1]){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.25, 10),
      new THREE.MeshStandardMaterial({ color:0x2c3a33, roughness:0.6 }));
    post.position.set(cx + s*(pw/2+0.5), -0.28+0.62, cz); post.castShadow = true; scene.add(post);
  }
  /* chain-link fence */
  const fenceTex = cvsTex(64, 64, (g,w,h)=>{
    g.clearRect(0,0,w,h); g.strokeStyle='rgba(150,160,158,0.9)'; g.lineWidth=2.5;
    for(let i=-1;i<=8;i++){
      g.beginPath(); g.moveTo(i*w/8,0); g.lineTo(i*w/8+w/8,h); g.stroke();
      g.beginPath(); g.moveTo(i*w/8,h); g.lineTo(i*w/8+w/8,0); g.stroke();
    }
  }, 1, 1);
  const FH = 3.1;
  const sides = [
    [COURT.x0, COURT.z0, COURT.x1, COURT.z0], [COURT.x0, COURT.z1, COURT.x1, COURT.z1],
    [COURT.x0, COURT.z0, COURT.x0, COURT.z1], [COURT.x1, COURT.z0, COURT.x1, COURT.z1]
  ];
  for (const [a,b,c,d] of sides){
    const horiz = Math.abs(c-a) > Math.abs(d-b);
    const L = horiz ? Math.abs(c-a) : Math.abs(d-b);
    const ft = fenceTex.clone(); ft.needsUpdate = true;
    ft.wrapS = ft.wrapT = THREE.RepeatWrapping; ft.repeat.set(L/1.6, FH/1.6);
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(L, FH),
      new THREE.MeshStandardMaterial({ map:ft, alphaMap:ft, transparent:true, side:THREE.DoubleSide,
        roughness:0.7, metalness:0.2, color:0xcfd6d4, depthWrite:false }));
    pl.position.set((a+c)/2, -0.28 + FH/2, (b+d)/2);
    if (!horiz) pl.rotation.y = Math.PI/2;
    scene.add(pl);
    const n = Math.max(2, Math.round(L/3.2));
    for (let i=0;i<=n;i++){
      const f = i/n;
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,FH,8),
        new THREE.MeshStandardMaterial({ color:0x6e7a76, roughness:0.6, metalness:0.3 }));
      p.position.set(a + (c-a)*f, -0.28 + FH/2, b + (d-b)*f); scene.add(p);
    }
    const rail = new THREE.Mesh(new THREE.BoxGeometry(horiz?L:0.07, 0.07, horiz?0.07:L),
      new THREE.MeshStandardMaterial({ color:0x6e7a76, roughness:0.6, metalness:0.3 }));
    rail.position.set((a+c)/2, -0.28 + FH, (b+d)/2); scene.add(rail);
  }
  /* umpire chair + bench */
  const chairPost = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.0, 0.5), MAT.trimOak);
  chairPost.position.set(COURT.x0+1.3, 0.72, cz); chairPost.castShadow = true; scene.add(chairPost);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.16, 0.9), MAT.trimOak);
  seat.position.set(COURT.x0+1.3, 1.75, cz); seat.castShadow = true; scene.add(seat);
  const bk = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.9, 0.9), MAT.trimOak);
  bk.position.set(COURT.x0+0.85, 2.2, cz); bk.castShadow = true; scene.add(bk);
}

/* Every shadow caster is an extra draw call into the shadow map each frame. Small
   trim — knobs, slats, battens, mullion bars — contributes nothing readable, so drop
   it from the shadow pass and keep the walls, roof, stairs and trees. */
function cullTinyShadowCasters(){
  let culled = 0;
  const box = new THREE.Box3(), size = new THREE.Vector3();
  for (const grp of [houseGroup, upperGroup, roofGroup, scene]){
    grp.traverse(o=>{
      if (!o.isMesh || !o.castShadow) return;
      box.setFromObject(o); box.getSize(size);
      const m = Math.max(size.x, size.y, size.z);
      if (m < 0.55){ o.castShadow = false; culled++; }
    });
  }
  return culled;
}

/* ---- furniture palette remap ----
   The Kenney kit ships a pastel palette (salmon upholstery, mint plants, blue-grey
   metal) that fights the warm oak and cream of the house. Every model is untextured
   flat-colour materials with stable names, so the whole kit can be re-graded here. */
const TINT_BASE = {
  wood:        0xc08a55,
  woodDark:    0x8b5e38,
  metal:       0xb9b2a4,
  metalDark:   0x47423a,
  metalMedium: 0x6a6152,
  metalLight:  0xf4efe3,
  carpetWhite: 0xf1e9da,
  glass:       0xcfe2de,
  plant:       0x5f9451,
  lamp:        0xffdfa4,
  _defaultMat: 0xece4d6
};
/* upholstery and rugs get variety so every sofa isn't the same colour */
const TINT_SOFT = [0xbe9a74, 0xa8907e, 0x8f9c86, 0xc4a98c, 0x9d8570, 0xb08a72];
const TINT_RUG  = [0x9a7c5e, 0x7f6b55, 0x8a7a62, 0xa08466, 0x6f6252];
function hashStr(str){
  let h = 2166136261;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
function retint(obj, seedStr){
  const seed = hashStr(seedStr || obj.name || 'x');
  obj.traverse(o=>{
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const out = mats.map(m=>{
      const n = m.name || '';
      let target = TINT_BASE[n];
      if (n === 'carpet')       target = TINT_SOFT[seed % TINT_SOFT.length];
      else if (n === 'carpetDarker') target = TINT_RUG[(seed >> 3) % TINT_RUG.length];
      if (target === undefined) return m;
      const c = m.clone();
      c.color.setHex(target);
      if (n === 'metal' || n === 'metalLight'){ c.metalness = 0.35; c.roughness = 0.45; }
      if (n === 'glass'){ c.transparent = true; c.opacity = 0.4; }
      return c;
    });
    o.material = Array.isArray(o.material) ? out : out[0];
  });
}

  if (pos.x >= MAIN.x0 && pos.x <= MAIN.x1 && pos.z >= MAIN.z0 && pos.z <= CORR_Z) return 'hall';

for (const k of Object.keys(EDGES)){
  const [a,b] = k.split('|');
  (ADJ[a] = ADJ[a]||[]).push([b,k,false]);
  (ADJ[b] = ADJ[b]||[]).push([a,k,true]);
}
function nodePath(a, b){
  if (a===b) return [a];
  const q=[[a]], seen=new Set([a]);
  while (q.length){
    const p = q.shift(), last = p[p.length-1];
    for (const [nb] of (ADJ[last]||[])){
      if (seen.has(nb)) continue;
      const np = [...p, nb];
      if (nb===b) return np;
      seen.add(nb); q.push(np);
    }
  }
  return [a,b];
}
function route(from, to){
  const a = nodeOf(from), b = nodeOf(to);
  const pts = [];
  if (a !== b){
    const np = nodePath(a,b);
    for (let i=0;i<np.length-1;i++){
      const k1 = np[i]+'|'+np[i+1], k2 = np[i+1]+'|'+np[i];
      if (EDGES[k1]) pts.push(...EDGES[k1].map(v=>v.clone()));
      else if (EDGES[k2]) pts.push(...EDGES[k2].slice().reverse().map(v=>v.clone()));
    }
  }
  pts.push(to.clone ? to.clone() : new THREE.Vector3(to.x, 0.22, to.z));
  const out = [];
  for (const p of pts){ if (!out.length || out[out.length-1].distanceTo(p) > 0.3) out.push(p); }
  return out;
}
function setDestination(ch, vec, seat){
  ch.seat = seat || null;
  if (ch.actions['Walk_Carry_Loop'] && Math.random() < 0.12){ ch.carrying = true; showHand(ch, 'box'); }
  else { ch.carrying = false; showHand(ch, null); }
  ch.path = route(ch.root.position, vec);
  ch.segLen = null;
  ch.state = 'walk';
  playAction(ch, ch.carrying ? 'Walk_Carry_Loop' : (ch.cfg.walk || 'Walk_Loop'));
}
function pickTarget(ch){
  const c = ch.cfg;
  /* in daylight there's a decent chance of heading out to the pool or the court */
  if (isDaytime() && !ch.spot && Math.random() < (c.outdoorBias != null ? c.outdoorBias : 0.20)){
    if (goOutdoor(ch)) return;
  }
  if (Math.random() < (c.sitBias||0.3)){
    const opts = SEATS.filter(st=>!st.busy && (!c.home || st.room===c.home || Math.random()<0.25));
    if (opts.length){
      const st = opts[Math.floor(Math.random()*opts.length)];
      st.busy = true;
      setDestination(ch, new THREE.Vector3(st.x + Math.sin(st.rot)*0.7, 0.22, st.z + Math.cos(st.rot)*0.7), st);
      return;
    }
  }
  let room;
  if (c.home && Math.random() < 0.55) room = ROOMS.find(r=>r.key===c.home);
  else room = ROOMS[Math.floor(Math.random()*ROOMS.length)];
  const rx = (Math.random()*2-1)*(room.hx-0.9), rz = (Math.random()*2-1)*(room.hz-0.9);
  setDestination(ch, new THREE.Vector3(room.x + rx, 0.22, room.z + rz), null);
}
/* ---- pool ripples and splash ---- */
const ripples = [];
let RIPPLE_GEO = null, RIPPLE_MAT = null;
function ripple(x, z, scale){
  if (!RIPPLE_GEO){
    RIPPLE_GEO = new THREE.RingGeometry(0.28, 0.36, 24);
    RIPPLE_MAT = new THREE.MeshBasicMaterial({ color:0xdff6ff, transparent:true,
      opacity:0.6, side:THREE.DoubleSide, depthWrite:false });
  }
  const m = new THREE.Mesh(RIPPLE_GEO, RIPPLE_MAT.clone());
  m.rotation.x = -Math.PI/2;
  m.position.set(x, POOL_SURFACE + 0.015, z);
  m.scale.setScalar(scale || 1);
  scene.add(m);
  ripples.push({ m, t:0, life:2.2, grow:(scale||1)*2.4 });
}
function updateRipples(dt){
  for (let i=ripples.length-1;i>=0;i--){
    const r = ripples[i]; r.t += dt;
    const f = r.t / r.life;
    r.m.scale.setScalar((r.grow) * (0.35 + f*1.0));
    r.m.material.opacity = 0.55 * (1 - f);
    if (f >= 1){ scene.remove(r.m); r.m.material.dispose(); ripples.splice(i,1); }
  }
}
/* droplets, reusing the confetti burst machinery */
function splash(x, y, z){
  const N = 26, geo = new THREE.BufferGeometry();
  const p = new Float32Array(N*3), v = [], colors = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    p[i*3]=x+(Math.random()-.5)*.5; p[i*3+1]=y+0.15; p[i*3+2]=z+(Math.random()-.5)*.5;
    v.push([(Math.random()-.5)*2.2, 1.6+Math.random()*1.8, (Math.random()-.5)*2.2]);
    colors[i*3]=0.84; colors[i*3+1]=0.95; colors[i*3+2]=1.0;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(p,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size:0.07, vertexColors:true }));
  scene.add(pts);
  bursts.push({ pts, v, life:1.1 });
  ripple(x, z, 1.6);
}

/* ---- tennis ball: an actual rally, with the swings timed to the bounce ---- */
let tennisBall = null, rally = null;
function ensureBall(){
  if (tennisBall) return tennisBall;
  tennisBall = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 10),
    new THREE.MeshStandardMaterial({ color:0xdff05a, roughness:0.85 }));
  tennisBall.castShadow = true; tennisBall.visible = false; scene.add(tennisBall);
  return tennisBall;
}
function startRally(a, b){
  ensureBall();
  rally = { p:[a, b], dir:0, t:0, dur:1.25, swung:false,
            fromX:a.root.position.x, toX:b.root.position.x };
  tennisBall.visible = true;
}
function stopRally(){
  rally = null;
  if (tennisBall) tennisBall.visible = false;
}
function updateRally(dt){
  if (!rally) return;
  const from = rally.p[rally.dir], to = rally.p[1-rally.dir];
  if (from.state !== 'tennis' || to.state !== 'tennis'){ stopRally(); return; }
  rally.t += dt;
  const f = Math.min(1, rally.t / rally.dur);
  const z0 = from.spot.z, z1 = to.spot.z;
  const x0 = rally.fromX, x1 = rally.toX;
  /* two hops: a low bounce just past the net, then into the receiver */
  const hop = f < 0.55 ? f/0.55 : (f-0.55)/0.45;
  const height = (f < 0.55 ? 1.5 : 0.9) * Math.sin(hop*Math.PI);
  tennisBall.position.set(x0 + (x1-x0)*f, COURT_Y + 0.1 + height, z0 + (z1-z0)*f);
  /* receiver tracks the ball and swings as it arrives */
  to.trackX = tennisBall.position.x;
  if (!rally.swung && f > 0.82){
    rally.swung = true;
    playAction(to, to.actions['Interact'] ? 'Interact' : 'Yes', true);
  }
  if (f >= 1){
    rally.dir = 1 - rally.dir; rally.t = 0; rally.swung = false;
    const nf = rally.p[rally.dir], nt = rally.p[1-rally.dir];
    rally.fromX = nf.root.position.x;
    /* aim somewhere reachable on the far side */
    rally.toX = nt.homeX + (Math.random()*2-1)*2.4;
  }
}

/* ---- outdoor life: sun loungers, the pool, and a tennis rally ---- */
const OUTDOOR = {
  loungers: [ {x:3.0, z:12.9, rot:Math.PI}, {x:5.9, z:12.9, rot:Math.PI},
              {x:9.9, z:12.9, rot:Math.PI}, {x:12.8, z:12.9, rot:Math.PI},
              {x:16.9, z:9.0, rot:Math.PI/2}, {x:16.9, z:5.6, rot:Math.PI/2} ],
  pool:     [ {x:4.2, z:5.2}, {x:7.0, z:9.4}, {x:11.6, z:5.6}, {x:13.0, z:9.6} ],
  tennis:   [ {x:30.0, z:-10.6, rot:0, y:COURT_Y}, {x:30.0, z:4.6, rot:Math.PI, y:COURT_Y} ]
};
OUTDOOR.loungers.forEach(o=>o.busy=false);
OUTDOOR.pool.forEach(o=>o.busy=false);
OUTDOOR.tennis.forEach(o=>o.busy=false);
function isDaytime(){ const h = hourFrac(); return h >= 8.5 && h < 20.0; }
function freeSpot(list){ const f = list.filter(o=>!o.busy); return f.length ? f[Math.floor(Math.random()*f.length)] : null; }
function releaseOutdoor(ch){
  if (ch.spot){ ch.spot.busy = false; ch.spot = null; }
  if (ch.racket){ ch.racket.visible = false; }
  if (ch.rally){ ch.rally = null; }
}
function goOutdoor(ch){
  const roll = Math.random();
  if (roll < 0.38){
    const sp = freeSpot(OUTDOOR.loungers); if (!sp) return false;
    sp.busy = true; ch.spot = sp; ch.outKind = 'lounge';
    setDestination(ch, new THREE.Vector3(sp.x + Math.cos(sp.rot||0)*1.25, DECK_Y, sp.z - Math.sin(sp.rot||0)*1.25), null);
    return true;
  }
  if (roll < 0.66){
    const sp = freeSpot(OUTDOOR.pool); if (!sp) return false;
    sp.busy = true; ch.spot = sp; ch.outKind = 'swim';
    setDestination(ch, new THREE.Vector3(sp.x, DECK_Y, POOL.z0 - 1.3), null);
    return true;
  }
  /* tennis needs a partner, so only start when both ends are free */
  if (OUTDOOR.tennis.every(t=>!t.busy)){
    const other = chars.find(c => c !== ch && ['idle','walk'].includes(c.state) && !c.goingToBed && !c.spot);
    if (!other) return false;
    OUTDOOR.tennis[0].busy = OUTDOOR.tennis[1].busy = true;
    ch.spot = OUTDOOR.tennis[0]; other.spot = OUTDOOR.tennis[1];
    ch.outKind = other.outKind = 'tennis';
    ch.rally = other; other.rally = ch;
    releaseSeat(other);
    setDestination(ch, new THREE.Vector3(ch.spot.x, COURT_Y, ch.spot.z), null);
    setDestination(other, new THREE.Vector3(other.spot.x, COURT_Y, other.spot.z), null);
    return true;
  }
  return false;
}
function releaseSeat(ch){ if (ch.seat){ ch.seat.busy=false; ch.seat=null; } }

/* --- greetings --- */
const GREETS = ["Сайн уу!","Hey!","How's the week going?","Did you see the ticker?","Coffee's fresh","Nice plumbob"];
const greetCooldown = {};
function tryGreetings(){
  for (let i=0;i<chars.length;i++) for (let j=i+1;j<chars.length;j++){
    const a = chars[i], b = chars[j];
    if (isNight()) return;
    if (a.goingToBed || b.goingToBed) continue;
    if (a.spot || b.spot) continue;
    if (!['idle','walk'].includes(a.state) || !['idle','walk'].includes(b.state)) continue;
    const key = a.cfg.key+'|'+b.cfg.key;
    if ((greetCooldown[key]||0) > perfNow()) continue;
    if (a.root.position.distanceTo(b.root.position) < 1.35){
      greetCooldown[key] = perfNow() + 90;
      for (const [me, other] of [[a,b],[b,a]]){
        releaseSeat(me);
        me.state = 'greet'; me.t = 4.2; me.path = null;
        const dir = new THREE.Vector3().subVectors(other.root.position, me.root.position);
        me.root.rotation.y = Math.atan2(dir.x, dir.z);
      }
      playAction(a, a.actions['Yes'] ? 'Yes' : 'Idle_Talking_Loop', !!a.actions['Yes']);
      playAction(b, 'Idle_Talking_Loop');
      a.bub.textContent = GREETS[Math.floor(Math.random()*GREETS.length)];
      b.bub.textContent = GREETS[Math.floor(Math.random()*GREETS.length)];
      a.bub.style.opacity = 1; b.bub.style.opacity = 1;
      a.bubT = -0.1; b.bubT = -0.1;
    }
  }
}
function perfNow(){ return performance.now()/1000; }
setInterval(tryGreetings, 700);

/* --- confetti --- */
const bursts = [];
function confetti(pos){
  const N = 90, geo = new THREE.BufferGeometry();
  const p = new Float32Array(N*3), v = [];
  const colors = new Float32Array(N*3);
  const palette = [[1,.42,.42],[1,.85,.37],[.49,.88,.54],[.42,.63,.91],[.79,.63,1]];
  for (let i=0;i<N;i++){
    p[i*3]=pos.x+(Math.random()-.5)*.4; p[i*3+1]=pos.y+2.2; p[i*3+2]=pos.z+(Math.random()-.5)*.4;
    v.push([(Math.random()-.5)*2.4, 1.5+Math.random()*2, (Math.random()-.5)*2.4]);
    const c = palette[i%5]; colors[i*3]=c[0]; colors[i*3+1]=c[1]; colors[i*3+2]=c[2];
  }
  geo.setAttribute('position', new THREE.BufferAttribute(p,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size:0.09, vertexColors:true }));
  scene.add(pts);
  bursts.push({ pts, v, life:2.4 });
}
function updateBursts(dt){
  for (let i=bursts.length-1;i>=0;i--){
    const b = bursts[i]; b.life -= dt;
    const arr = b.pts.geometry.attributes.position.array;
    for (let k=0;k<b.v.length;k++){
      b.v[k][1] -= 4.5*dt;
      arr[k*3]   += b.v[k][0]*dt;
      arr[k*3+1] = Math.max(0.05, arr[k*3+1] + b.v[k][1]*dt);
      arr[k*3+2] += b.v[k][2]*dt;
    }
    b.pts.geometry.attributes.position.needsUpdate = true;
    b.pts.material.opacity = Math.min(1, b.life); b.pts.material.transparent = true;
    if (b.life <= 0){ scene.remove(b.pts); bursts.splice(i,1); }
  }
}
function celebrate(key){
  const ch = chars.find(c=>c.cfg.key===key); if (!ch) return;
  releaseSeat(ch); ch.path = null;
  ch.state = 'act'; ch.t = 4.5; playAction(ch, 'Dance_Loop');
  confetti(ch.root.position); blip();
}

function isNight(){ const h = hourFrac(); return h >= 22.8 || h < 6.2; }
function bedOf(key){ return BEDS.find(b=>b.owner===key); }
/* NOTE: never crossFadeFrom(..., warp=true) here — warping overwrites timeScale
   and the reversed lay-down silently plays forward, leaving them stood on the bed. */
function playLay(ch, reverse){
  const a = ch.actions['LayToIdle']; if (!a) return false;
  if (ch.cur && ch.cur !== a) ch.cur.fadeOut(0.22);
  a.stop();
  a.enabled = true; a.paused = false;
  a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true;
  a.setEffectiveWeight(1);
  a.time = reverse ? a.getClip().duration : 0;
  a.timeScale = reverse ? -1 : 1;
  a.fadeIn(0.22);
  a.play(); ch.cur = a; return true;
}
/* freeze the lay clip on its first frame — that frame IS the sleeping pose */
function holdAsleep(ch){
  const a = ch.actions['LayToIdle']; if (!a) return;
  a.enabled = true; a.setEffectiveWeight(1); a.time = 0; a.paused = true; ch.cur = a;
}
/* The clip's first frame is a RECLINED pose, not a flat one, so the body has to be
   tilted back to lie level on the mattress. Rather than hard-code an angle (the pose
   differs per rig), solve for it once from the actual bone positions. */
let LAY_TILT = null, LAY_PELVIS_DY = 0.25, LAY_MID_DZ = 0, LAY_HEAD_DZ = -0.6;
const MATTRESS_TOP = 0.52;
function solveLayTilt(ch){
  const a = ch.actions['LayToIdle'];
  if (!a){ LAY_TILT = 0; return; }
  let head=null, foot=null, pelvis=null;
  ch.root.traverse(o=>{ if (o.isBone){
    if (o.name==='Head') head=o; else if (o.name==='foot_l') foot=o; else if (o.name==='pelvis') pelvis=o; } });
  if (!head || !foot){ LAY_TILT = -0.43; return; }
  const savedPos = ch.root.position.clone(), savedRX = ch.root.rotation.x, savedRY = ch.root.rotation.y;
  const savedW = {}; for (const k in ch.actions){ savedW[k] = ch.actions[k].getEffectiveWeight(); ch.actions[k].setEffectiveWeight(0); }
  a.stop(); a.enabled = true; a.setEffectiveWeight(1); a.setLoop(THREE.LoopOnce);
  a.clampWhenFinished = true; a.time = 0; a.paused = true; a.play();
  ch.root.position.set(0,0,0); ch.root.rotation.y = 0;
  const h = new THREE.Vector3(), f = new THREE.Vector3(), pv = new THREE.Vector3();
  const probe = th => {
    ch.root.rotation.x = th; ch.mixer.update(0.0001); ch.root.updateMatrixWorld(true);
    head.getWorldPosition(h); foot.getWorldPosition(f); if (pelvis) pelvis.getWorldPosition(pv);
    return h.y - f.y;                       /* 0 ⇒ body is level */
  };
  /* secant search on the tilt that levels head and feet */
  let t0 = 0, f0 = probe(t0), t1 = -0.6, f1 = probe(t1);
  for (let i=0; i<7; i++){
    if (Math.abs(f1) < 0.004 || Math.abs(f1-f0) < 1e-6) break;
    const t2 = t1 - f1*(t1-t0)/(f1-f0);
    t0 = t1; f0 = f1; t1 = Math.max(-2.2, Math.min(2.2, t2)); f1 = probe(t1);
  }
  LAY_TILT = t1;
  probe(LAY_TILT);
  LAY_PELVIS_DY = pelvis ? pv.y : (h.y+f.y)/2;
  LAY_MID_DZ = (h.z + f.z)/2;
  LAY_HEAD_DZ = h.z;
  /* restore */
  for (const k in ch.actions) ch.actions[k].setEffectiveWeight(savedW[k]);
  a.paused = false; a.stop();
  ch.root.position.copy(savedPos); ch.root.rotation.x = savedRX; ch.root.rotation.y = savedRY;
}
function bedPose(bed){
  /* head toward the headboard; torso resting just above the mattress */
  const yaw = LAY_HEAD_DZ < 0 ? 0 : Math.PI;
  /* beds against the north wall sleep head-to-north; the flipped pair head-to-south */
  const flip = !!bed.flip;
  const y = FLOOR2_Y + MATTRESS_TOP + 0.13 - LAY_PELVIS_DY;
  if (!flip) return { x: bed.x, y, z: bed.z + 0.05 - LAY_MID_DZ, yaw: 0 };
  return { x: bed.x, y, z: bed.z - 0.05 + LAY_MID_DZ, yaw: Math.PI };
}
function startLay(ch, bed){
  const a = ch.actions['LayToIdle'];
  if (LAY_TILT === null) solveLayTilt(ch);
  ch.layDur = a ? a.getClip().duration : 1.2;
  ch.layP0 = ch.root.position.clone();
  ch.layYaw0 = ch.root.rotation.y;
  ch.layTo = bedPose(bed);
  if (ch.ring) ch.ring.visible = false;
  if (ch.pip) ch.pip.visible = false;
  ch.state = 'layDown'; ch.t = ch.layDur + 0.1;
  if (!playLay(ch, true)){ applyLay(ch, 1); ch.state='sleep'; ch.t=8; }
}
function applyLay(ch, p){
  const e = p*p*(3-2*p);                       /* ease so they settle, not snap */
  const t = ch.layTo, f = ch.layP0;
  ch.root.position.set(f.x + (t.x-f.x)*e, f.y + (t.y-f.y)*e, f.z + (t.z-f.z)*e);
  let d = ((t.yaw - ch.layYaw0 + Math.PI*3) % (Math.PI*2)) - Math.PI;
  ch.root.rotation.y = ch.layYaw0 + d*e;
  ch.root.rotation.x = (LAY_TILT||0) * e;
}
function endLay(ch){
  ch.root.rotation.x = 0;
  if (ch.ring) ch.ring.visible = true;
}
let plumbT = 0, qAccum = 0, qSamples = 0;
function updateChar(ch, dt){
  ch.mixer.update(dt);
  if (ch.plumb){ plumbT += dt; ch.plumb.rotation.y += dt*1.6;
    ch.plumb.position.y = 2.5 + Math.sin(plumbT*2)*0.09;
    ch.plumb.material.color.set(moodColor(avgNeeds())); }
  ch.t -= dt;
  /* bedtime */
  if (isNight() && ch.spot) releaseOutdoor(ch);
  if (isNight() && !['sleep','layDown','wake','swim','tennis','sunbathe'].includes(ch.state)
      && (!ch.goingToBed || (ch.state==='idle' && (!ch.path || !ch.path.length)))){
    const bed = bedOf(ch.cfg.key);
    if (bed){ releaseSeat(ch); ch.goingToBed = true;
      setDestination(ch, new THREE.Vector3(bed.x, FLOOR2_Y+0.22, bed.z + (bed.flip ? -1.9 : 1.9)), null); }
  }
  if (!isNight() && ch.state==='sleep'){
    const a = ch.actions['LayToIdle']; if (a) a.paused = false;
    ch.layDur = a ? a.getClip().duration : 1.2;
    ch.layP0 = ch.root.position.clone(); ch.layYaw0 = ch.root.rotation.y;
    const bw = bedOf(ch.cfg.key);
    ch.layTo = { x: ch.root.position.x, y: FLOOR2_Y+0.22,
      z: (bw ? bw.z + (bw.flip ? -1.9 : 1.9) : ch.root.position.z), yaw: ch.root.rotation.y };
    ch.state='wake'; ch.t = ch.layDur + 0.1;
    playLay(ch, false);
  }
  if (ch.state==='layDown'){
    applyLay(ch, 1 - Math.max(0, ch.t)/ch.layDur);
    if (ch.t<=0){
      applyLay(ch, 1); holdAsleep(ch);
      if (ch.afterLay === 'sunbathe'){ ch.afterLay = null; ch.state='sunbathe'; ch.t = 24 + Math.random()*20; }
      else { ch.state='sleep'; ch.t=8; }
    }
  }
  else if (ch.state==='wake'){
    /* reverse of the tilt: unfold from the mattress back onto their feet */
    const p = 1 - Math.max(0, ch.t)/ch.layDur, e = p*p*(3-2*p);
    const f = ch.layP0, t2 = ch.layTo;
    ch.root.position.set(f.x + (t2.x-f.x)*e, f.y + (t2.y-f.y)*e, f.z + (t2.z-f.z)*e);
    ch.root.rotation.x = (LAY_TILT||0) * (1-e);
  }
  else if (ch.state==='sleep'){
    if (ch.t<=0){ ch.t=8; ch.bub.textContent='Zzz…'; ch.bub.style.opacity=1; setTimeout(()=>{ if(ch.state==='sleep') ch.bub.style.opacity=0; }, 3200); }
    return;
  }
  else if (ch.state==='wake' && ch.t<=0){
    endLay(ch); releaseOutdoor(ch);
    ch.root.rotation.z = 0;
    ch.goingToBed = false; ch.state='idle'; ch.t=1+Math.random()*2;
    ch.cur = null; playAction(ch,'Idle_Loop');
  }
  if (ch.state==='idle' && ch.t<=0){
    const roll = Math.random(), c = ch.cfg;
    if (roll < 0.55){ pickTarget(ch); }
    else if (roll < 0.55+(c.danceBias||0.04) && ch.actions['Dance_Loop']){ ch.state='act'; ch.t=4.5; playAction(ch,'Dance_Loop'); }
    else if (roll < 0.85 && c.acts && c.acts.length){
      const [nm, dur, once] = c.acts[Math.floor(Math.random()*c.acts.length)];
      if (ch.actions[nm]){
        ch.state='act'; ch.t = dur; playAction(ch, nm, !!once);
        showHand(ch, nm === 'Consume' ? 'mug' : (nm === 'Idle_FoldArms_Loop' ? 'book' : null));
      }
      else { ch.t = 2; }
    }
    else if (roll < 0.9 && ch.actions['Fixing_Kneeling']){ ch.state='act'; ch.t=3.2; playAction(ch,'Fixing_Kneeling',true); }
    else { ch.t = 3+Math.random()*5; }
  }
  else if (ch.state==='walk'){
    if (!ch.path || !ch.path.length){ ch.state='idle'; ch.t=1; playAction(ch,'Idle_Loop'); return; }
    const target = ch.path[0];
    const pos = ch.root.position;
    const dir = new THREE.Vector3().subVectors(target, pos); dir.y = 0;
    const dist = dir.length();
    /* remember where this leg started so height can ramp smoothly up the stairs */
    if (ch.segLen == null){ ch.segLen = Math.max(dist, 0.001); ch.segY0 = pos.y; }
    if (dist < 0.18){
      pos.y = target.y;
      ch.path.shift(); ch.segLen = null;
      if (!ch.path.length){
        if (ch.goingToBed && isNight()){
          const bed = bedOf(ch.cfg.key);
          startLay(ch, bed);
        }
        else if (ch.spot && ch.outKind === 'lounge'){
          if (LAY_TILT === null) solveLayTilt(ch);
          ch.layDur = (ch.actions['LayToIdle'] ? ch.actions['LayToIdle'].getClip().duration : 1.2);
          ch.layP0 = ch.root.position.clone(); ch.layYaw0 = ch.root.rotation.y;
          const lyaw = ch.spot.rot || 0;
          ch.layTo = { x: ch.spot.x - LAY_MID_DZ*Math.sin(lyaw),
                       y: 0.63 - LAY_PELVIS_DY,
                       z: ch.spot.z - LAY_MID_DZ*Math.cos(lyaw), yaw: lyaw };
          if (ch.ring) ch.ring.visible = false;
          if (ch.pip) ch.pip.visible = false;
          ch.state = 'layDown'; ch.t = ch.layDur + 0.1;
          if (!playLay(ch, true)){ applyLay(ch, 1); ch.state='sunbathe'; ch.t=26; }
          else ch.afterLay = 'sunbathe';
        }
        else if (ch.spot && ch.outKind === 'swim'){
          /* there is no swim clip in the animation pack, so floating on the back
             reuses the solved lie-down pose, and treading water keeps them upright
             but submerged to the chest. Both read as swimming; standing did not. */
          splash(ch.spot.x, POOL_SURFACE, ch.spot.z);
          ch.swimStyle = Math.random() < 0.55 ? 'float' : 'tread';
          ch.state = 'swim'; ch.t = 22 + Math.random()*20;
          ch.swimT = Math.random()*6;
          ch.swimYaw = Math.random()*Math.PI*2;
          if (ch.ring) ch.ring.visible = false;
          if (ch.pip) ch.pip.visible = false;
          if (ch.swimStyle === 'float'){
            if (LAY_TILT === null) solveLayTilt(ch);
            ch.root.rotation.x = LAY_TILT || 0;
            holdAsleep(ch);
            ch.root.position.set(ch.spot.x, POOL_SURFACE - 0.24 - LAY_PELVIS_DY, ch.spot.z);
          } else {
            ch.root.rotation.x = 0;
            ch.root.position.set(ch.spot.x, POOL_SURFACE - 1.12, ch.spot.z);
            ch.cur = null; playAction(ch, 'Idle_Loop');
          }
        }
        else if (ch.spot && ch.outKind === 'tennis'){
          ch.root.position.set(ch.spot.x, ch.spot.y != null ? ch.spot.y : 0.22, ch.spot.z);
          ch.root.rotation.y = ch.spot.rot;
          ch.state = 'tennis'; ch.t = 26 + Math.random()*14;
          ch.tennisT = 0; ch.homeX = ch.spot.x;
          if (!ch.racket) ch.racket = makeRacket(ch);
          ch.racket.visible = true;
          playAction(ch, 'Idle_Loop');
          if (ch.rally && ch.rally.state === 'tennis') startRally(ch, ch.rally);
        }
        else if (ch.seat){
          ch.root.position.set(ch.seat.x, 0.22, ch.seat.z);
          ch.root.rotation.y = ch.seat.rot;
          ch.state='sitEnter'; ch.t=1.0; playAction(ch,'Sitting_Enter',true);
        } else { ch.state='idle'; ch.t = 2.5+Math.random()*6; playAction(ch,'Idle_Loop'); }
      }
    } else {
      dir.normalize();
      pos.addScaledVector(dir, Math.min(ch.speed*dt, dist));
      if (target.y !== ch.segY0){
        const prog = Math.min(1, Math.max(0, 1 - dist/ch.segLen));
        pos.y = ch.segY0 + (target.y - ch.segY0) * prog;
      }
      const yaw = Math.atan2(dir.x, dir.z);
      let cy = ch.root.rotation.y;
      let dyaw = ((yaw - cy + Math.PI*3) % (Math.PI*2)) - Math.PI;
      ch.root.rotation.y = cy + dyaw * Math.min(1, dt*8);
    }
  }
  else if (ch.state==='sunbathe'){
    if (ch.t<=0){
      const a = ch.actions['LayToIdle']; if (a) a.paused = false;
      ch.layDur = a ? a.getClip().duration : 1.2;
      ch.layP0 = ch.root.position.clone();
      ch.layYaw0 = ch.root.rotation.y;
      const sp = ch.spot, syaw = sp ? (sp.rot||0) : 0;
      /* step off the side of the lounger, not through it */
      ch.layTo = { x: (sp ? sp.x : ch.root.position.x) + Math.cos(syaw)*1.25,
                   y: DECK_Y,
                   z: (sp ? sp.z : ch.root.position.z) - Math.sin(syaw)*1.25,
                   yaw: ch.root.rotation.y };
      ch.state = 'wake'; ch.t = ch.layDur + 0.1;
      playLay(ch, false);
    }
    return;
  }
  else if (ch.state==='swim'){
    if (ch.swimYaw == null) ch.swimYaw = Math.random()*Math.PI*2;
    if (!isFinite(ch.root.position.x) || !isFinite(ch.root.position.z)){
      ch.root.position.x = ch.spot ? ch.spot.x : (POOL.x0+POOL.x1)/2;
      ch.root.position.z = ch.spot ? ch.spot.z : (POOL.z0+POOL.z1)/2;
    }
    ch.swimT = (ch.swimT || 0) + dt;
    const drift = 0.42;
    ch.swimYaw += Math.sin(ch.swimT*0.23)*dt*0.5;
    const dx = Math.sin(ch.swimYaw)*drift*dt, dz = Math.cos(ch.swimYaw)*drift*dt;
    let nx = ch.root.position.x + dx, nz = ch.root.position.z + dz;
    /* bounce off the pool walls instead of drifting through them */
    const m = 1.1;
    if (nx < POOL.x0+m || nx > POOL.x1-m){ ch.swimYaw = -ch.swimYaw; nx = ch.root.position.x; }
    if (nz < POOL.z0+m || nz > POOL.z1-m){ ch.swimYaw = Math.PI - ch.swimYaw; nz = ch.root.position.z; }
    ch.root.position.x = nx; ch.root.position.z = nz;
    /* a ripple trail so they visibly disturb the water */
    ch.ripT = (ch.ripT || 0) + dt;
    if (ch.ripT > 0.55){ ch.ripT = 0; ripple(nx, nz, 0.85); }
    if (ch.swimStyle === 'float'){
      ch.root.position.y = POOL_SURFACE - 0.24 - LAY_PELVIS_DY + Math.sin(ch.swimT*1.3)*0.035;
      ch.root.rotation.x = (LAY_TILT||0);
      ch.root.rotation.y = ch.swimYaw + Math.PI;
      ch.root.rotation.z = Math.sin(ch.swimT*0.9)*0.07;
    } else {
      ch.root.position.y = POOL_SURFACE - 1.12 + Math.sin(ch.swimT*2.1)*0.055;
      ch.root.rotation.y = ch.swimYaw;
      ch.root.rotation.z = Math.sin(ch.swimT*1.5)*0.05;
      if (Math.random() < 0.004) playAction(ch,'Idle_Talking_Loop');
    }
    if (ch.t<=0){
      /* climb out at the nearest edge */
      splash(ch.root.position.x, POOL_SURFACE, ch.root.position.z);
      releaseOutdoor(ch);
      ch.root.rotation.set(0, ch.root.rotation.y, 0);
      ch.root.position.set(ch.root.position.x, DECK_Y, POOL.z0 - 1.5);
      if (ch.ring) ch.ring.visible = true;
      ch.state='idle'; ch.t=1.5; ch.cur=null; playAction(ch,'Idle_Loop');
    }
    return;
  }
  else if (ch.state==='tennis'){
    ch.tennisT += dt;
    /* slide toward where the ball is heading, rather than a blind sine shuffle */
    const want = ch.trackX != null ? ch.trackX : ch.homeX;
    const lim = 3.2;
    const tx = Math.max(ch.homeX - lim, Math.min(ch.homeX + lim, want));
    ch.root.position.x += (tx - ch.root.position.x) * Math.min(1, dt*2.6);
    ch.root.position.y = COURT_Y;
    ch.root.rotation.y = ch.spot.rot;
    if (ch.t<=0){
      stopRally(); releaseOutdoor(ch);
      ch.state='idle'; ch.t=1.5; ch.cur=null; playAction(ch,'Idle_Loop');
    }
    return;
  }
  else if (ch.state==='sitEnter' && ch.t<=0){ ch.state='sit'; ch.t = 12+Math.random()*16; playAction(ch,'Sitting_Idle_Loop'); }
  else if (ch.state==='sit' && ch.t<=0){ ch.state='sitExit'; ch.t=1.0; playAction(ch,'Sitting_Exit',true); }
  else if (ch.state==='sitExit' && ch.t<=0){
    const st = ch.seat; releaseSeat(ch);
    if (st){ ch.root.position.set(st.x + Math.sin(st.rot)*0.8, 0.22, st.z + Math.cos(st.rot)*0.8); }
    ch.state='idle'; ch.t=2+Math.random()*4; playAction(ch,'Idle_Loop');
  }
  else if (ch.state==='greet' && ch.t<=0){ ch.state='idle'; ch.t=1.5+Math.random()*3; playAction(ch,'Idle_Loop'); }
  else if (ch.state==='act' && ch.t<=0){ showHand(ch, null); ch.state='idle'; ch.t=2+Math.random()*4; playAction(ch,'Idle_Loop'); }
  /* bubble: live activity + personality quips */
  ch.bubT -= dt;
  if (['greet','layDown','wake','swim','tennis','sunbathe'].includes(ch.state) || ch.goingToBed) return;
  const show = ch.bubT <= 0 && ch.bubT > -6;
  if (ch.bubT <= -18) { ch.bubT = 9+Math.random()*13; ch.nextQuip = null; }
  const st2 = DATA['agent-status'][ch.cfg.key];
  if (show){
    if (!ch.nextQuip){
      const quips = ch.cfg.quips||[];
      ch.nextQuip = (Math.random()<0.5 && st2 && st2.activity) ? st2.activity
        : quips[Math.floor(Math.random()*quips.length)] || (st2&&st2.activity) || '…';
    }
    ch.bub.textContent = ch.nextQuip; ch.bub.style.opacity = 1;
    if (ch.state==='idle') playAction(ch,'Idle_Talking_Loop');
    else if (ch.state==='sit') playAction(ch,'Sitting_Talking_Loop');
  } else {
    ch.bub.style.opacity = 0;
    if (ch.state==='idle' && ch.cur===ch.actions['Idle_Talking_Loop']) playAction(ch,'Idle_Loop');
    else if (ch.state==='sit' && ch.cur===ch.actions['Sitting_Talking_Loop']) playAction(ch,'Sitting_Idle_Loop');
  }
}

    if (ch){ openPanel('<h2>'+ch.cfg.name+'</h2><div class="sub">RESIDENT</div>'+agentRow(ch.cfg.key)); blip(); return; }

let audio = null, soundOn = false;
function blip(){ if (!soundOn || !audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type='square'; o.frequency.value = 660; g.gain.value = 0.03;
  o.connect(g); g.connect(audio.destination);
  o.start(); o.frequency.exponentialRampToValueAtTime(990, audio.currentTime+0.07);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime+0.12); o.stop(audio.currentTime+0.13);
}
let padTimer = null;
const SCALE = [220, 261.6, 293.7, 329.6, 392, 440];
function padNote(){
  if (!soundOn || !audio) return;
  const f = SCALE[Math.floor(Math.random()*SCALE.length)] * (Math.random()<0.3?2:1);
  const o = audio.createOscillator(), g = audio.createGain(), lp = audio.createBiquadFilter();
  o.type = 'triangle'; o.frequency.value = f;
  lp.type='lowpass'; lp.frequency.value = 900;
  g.gain.value = 0;
  o.connect(lp); lp.connect(g); g.connect(audio.destination);
  const t = audio.currentTime;
  g.gain.linearRampToValueAtTime(0.028, t+0.4);
  g.gain.linearRampToValueAtTime(0.0, t+2.6);
  o.start(); o.stop(t+2.7);
}
$('soundbtn').addEventListener('click', ()=>{
  if (!audio) audio = new (window.AudioContext||window.webkitAudioContext)();
  soundOn = !soundOn;
  $('soundbtn').textContent = soundOn ? '♪ SOUND: ON' : '♪ SOUND: OFF';
  if (soundOn){ padNote(); padTimer = setInterval(padNote, 1400); blip(); }
  else clearInterval(padTimer);
});

function resetCamera(){

/* WASD / arrow keys glide the camera across the lot; Q and E swing it around */
function keyboardCamera(dt){
  if (!controls || followChar) return;
  const pan = new THREE.Vector3();
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0)).normalize();
  const sp = 16 * dt / Math.max(0.4, camera.zoom);
  if (KEYS['w'] || KEYS['arrowup'])    pan.addScaledVector(fwd, sp);
  if (KEYS['s'] || KEYS['arrowdown'])  pan.addScaledVector(fwd, -sp);
  if (KEYS['a'] || KEYS['arrowleft'])  pan.addScaledVector(right, -sp);
  if (KEYS['d'] || KEYS['arrowright']) pan.addScaledVector(right, sp);
  if (pan.lengthSq() > 0){ controls.target.add(pan); camera.position.add(pan); }
  if (KEYS['q'] || KEYS['e']){
    const ang = (KEYS['q'] ? 1 : -1) * dt * 1.1;
    const off = new THREE.Vector3().subVectors(camera.position, controls.target);
    off.applyAxisAngle(new THREE.Vector3(0,1,0), ang);
    camera.position.copy(controls.target).add(off);
  }
}
{ const cv = $('chip-view'); if (cv) cv.addEventListener('click', cycleView); }
{ const cf = $('chip-fx'); if (cf) cf.addEventListener('click', ()=>{
    const order = ['high','med','low'];
    QUALITY.level = order[(order.indexOf(QUALITY.level)+1) % 3];
    qSamples = 999; applyQuality(); if (typeof blip==='function') blip();
  }); }

/* ================= main loop ================= */
const clock = new THREE.Clock();
const FPS_CAP = WALLPAPER ? 24 : 60;
let acc = 0, sway = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  acc += dt;
  if (acc < 1/FPS_CAP) return;
  const step = acc; acc = 0;
  for (const ch of chars) updateChar(ch, step);
  if (WALLPAPER){
    sway += step*0.05;
    const r = 46.0;
    camera.position.x = 8 + Math.sin(0.79 + Math.sin(sway)*0.07) * r;
    camera.position.z = -4 + Math.cos(0.79 + Math.sin(sway)*0.07) * r;
    camera.position.y = 30;
    camera.lookAt(8, 0, -4);
  } else if (controls){
    if (followChar){
      controls.target.lerp(followChar.root.position.clone().setY(1.1), 0.08);
      camera.zoom += (2.1 - camera.zoom)*0.05; camera.updateProjectionMatrix();
    }
    controls.update();
  }
  /* watch real frame time for the first few seconds and step quality down if needed */
  if (qSamples < 90){
    qAccum += dt; qSamples++;
    if (qSamples === 90){
      const fps = 90 / qAccum;
      if (fps < 24 && QUALITY.level !== 'low'){ QUALITY.level = 'low'; applyQuality(); }
      else if (fps < 42 && QUALITY.level === 'high'){ QUALITY.level = 'med'; applyQuality(); }
    }
  }
  keyboardCamera(step);
  updateRally(step);
  updateRipples(step);
  updateBursts(step);
  if (poolWater) poolWater.material.uniforms.uTime.value += step;
  if (composer && FX.on) composer.render(step); else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* ================= boot ================= */
(async ()=>{
  try {
    if (!renderer.getContext()) throw new Error('no webgl');
    await placeFurniture();
    await placeGarden();
    await placeStreet();
    await placeDoorframes();
    await placeBedroom();
    await placeKitchen();
    await placeOutdoorFurniture();
    cullTinyShadowCasters();
    applyView();
    refreshLamps();
    applyQuality();
    await buildCast();
    $('loader').style.opacity = 0;
    setTimeout(()=> $('loader').remove(), 900);
    window._chars = chars; window._nodeOf = nodeOf; window._cam = camera; window._controls = controls;
    window._scene = scene; window._renderer = renderer;
    window._setView = m=>{ viewMode = m; applyView(); };
    window._forceOutdoor = (ch, kind, partner)=>{
      releaseOutdoor(ch); releaseSeat(ch);
      if (kind==='tennis' && partner){
        releaseOutdoor(partner); releaseSeat(partner);
        OUTDOOR.tennis[0].busy = OUTDOOR.tennis[1].busy = true;
        ch.spot = OUTDOOR.tennis[0]; partner.spot = OUTDOOR.tennis[1];
        ch.outKind = partner.outKind = 'tennis'; ch.rally = partner; partner.rally = ch;
        setDestination(ch, new THREE.Vector3(ch.spot.x, 0.22, ch.spot.z), null);
        setDestination(partner, new THREE.Vector3(partner.spot.x, 0.22, partner.spot.z), null);
        return;
      }
      const list = kind==='lounge' ? OUTDOOR.loungers : OUTDOOR.pool;
      const sp = list.find(o=>!o.busy); if (!sp) return;
      sp.busy = true; ch.spot = sp; ch.outKind = kind;
      setDestination(ch, new THREE.Vector3(kind==='lounge'? sp.x : sp.x, 0.22,
        kind==='lounge' ? sp.z + 1.6 : POOL.z0 - 1.3), null);
    };
    window._snapOutdoor = (ch, kind, partner)=>{
      releaseOutdoor(ch); releaseSeat(ch); ch.path = null;
      if (kind === 'tennis' && partner){
        releaseOutdoor(partner); releaseSeat(partner); partner.path = null;
        OUTDOOR.tennis[0].busy = OUTDOOR.tennis[1].busy = true;
        [[ch, 0], [partner, 1]].forEach(([c, i])=>{
          c.spot = OUTDOOR.tennis[i]; c.outKind = 'tennis';
          c.root.position.set(c.spot.x, 0.22, c.spot.z); c.root.rotation.set(0, c.spot.rot, 0);
          c.state = 'tennis'; c.t = 60; c.tennisT = i*0.7; c.homeX = c.spot.x;
          if (!c.racket) c.racket = makeRacket(c);
          c.racket.visible = true; c.cur = null; playAction(c, 'Idle_Loop');
        });
        startRally(ch, partner);
        return;
      }
      const list = kind === 'lounge' ? OUTDOOR.loungers : OUTDOOR.pool;
      const sp = list.find(o=>!o.busy); if (!sp) return;
      sp.busy = true; ch.spot = sp; ch.outKind = kind;
      if (kind === 'lounge'){
        if (LAY_TILT === null) solveLayTilt(ch);
        ch.layP0 = ch.root.position.clone(); ch.layYaw0 = 0;
        const lyaw = sp.rot || 0;
        ch.layTo = { x: sp.x - LAY_MID_DZ*Math.sin(lyaw), y: 0.63 - LAY_PELVIS_DY,
                     z: sp.z - LAY_MID_DZ*Math.cos(lyaw), yaw: lyaw };
        ch.layDur = 1; if (ch.ring) ch.ring.visible = false; if (ch.pip) ch.pip.visible = false;
        applyLay(ch, 1); holdAsleep(ch); ch.state = 'sunbathe'; ch.t = 90;
      } else {
        ch.root.position.set(sp.x, -0.62, sp.z);
        ch.state = 'swim'; ch.t = 90; ch.swimT = Math.random()*4;
        ch.swimYaw = Math.random()*Math.PI*2; ch.swimStyle = Math.random()<0.55?'float':'tread';
        if (ch.ring) ch.ring.visible = false; ch.cur = null; playAction(ch, 'Idle_Loop');
      }
    };
    window._gtaoOff = ()=>{ if(gtao) gtao.enabled=false; };
    window._BEDS = BEDS; window._F2Y = FLOOR2_Y; window.THREE_V3 = THREE.Vector3;
    window._startLay = startLay; window._applyLay = applyLay; window._holdAsleep = holdAsleep;
    window._layInfo = ()=>({ tilt:LAY_TILT, pelvisDY:LAY_PELVIS_DY, midDZ:LAY_MID_DZ, headDZ:LAY_HEAD_DZ });
    animate();
  } catch(e){
    console.error(e);
    $('loadmsg').textContent = '3D unavailable — opening pixel mode…';
    setTimeout(()=> location.href = './pixel.html', 1200);
  }
})();
